# harness.yaml — 编排层（状态机 / 路由 / 预算 / 白名单 / 降级）唯一数据源
# ══════════════════════════════════════════════════════════
# v2.2.0 新增。缘由（2026-09-29 基线实测）：
#   编排全靠主理人自觉遵守 Markdown 纪律 → 成员不可调度即整链阻断（苏学法 ×3）、
#   静默降级无人察觉（严真奥被登记为 general-purpose）、预算与耗时无任何计量。
# 原则：**方法论下沉为代码**。本文件是编排事实的唯一源，scripts/harness.py 消费它，
# MD 里只留"人读说明 + 指向本文件"，禁止 MD 与脚本各写一套。
#
# 消费方：scripts/harness.py（preflight / route / state / budget / trace / gate）

# ⚠ 版本号四处一致性由体检第 14 项守（.codebuddy-plugin/plugin.json 为权威），
#   本批（v3.17.0）**不改**本键——版本号统一由主理人在收尾时同步四处，
#   单改此处会让第 14 项立即判红（本行须保持 `version: "x.y.z"` 独占且行尾无注释）。
version: "3.18.0"
# ── 显式状态机：阶段号 → 合法成员、门禁、后继 ──────────────────
# v3.0.0：六阶段 → **四道闸**（第二轮诊断方案 C）。
# v3.3.0：扩为 5 闸（追加 stage 4 = 闸 4.5 案例三源核验），双轨期 0-4 合法。
# 只认整数 0-4；任何其它取值（如 "M5A2"、"stage_6"）一律判非法。
stages:
  0: {name: "闸1 任务冻结", members: [], gate: "user_confirm", parallel: no, next: 1}
  # v3.17.0 批次 B：stage 1 由 parallel: yes 改 **no**（伪并行修正）——
  #   蓝图（pedagogy-architect）的「二八难点清单」依赖证据包（dvm-content-expert）的
  #   「易误解」标注，两侧**存在真实数据依赖**、边界并不互斥。原声明"并行、任务边界互斥"
  #   与事实相反：并行后蓝图方必然回问，每次多一轮往返。改串行：证据先行 → 蓝图。
  1: {name: "闸2 设计（证据先行→蓝图·串行）", members: ["pedagogy-architect", "dvm-content-expert"], gate: "user_confirm", parallel: no, next: 2}
  2: {name: "闸3 成稿（页表∥版式）", members: ["pedagogy-architect", "visual-slide-designer"], gate: "script_check", parallel: yes, next: 3}
  3: {name: "闸4 交付（门禁+独立验证）", members: ["verifier"], gate: "gate_script+verifier", parallel: no, next: 4}
  4: {name: "闸4.5 案例三源核验（v3.3.0）", members: ["dvm-content-expert", "verifier"], gate: "three_source_check", parallel: yes, next: null}
# v3.16.0 澄清（只加注释，不改任何语义/成员数组）：
#   读本段时容易误判"ppt-producer 漏配"——它**不占 stage 位**：
#   v3.0.0 起不再常驻 spawn，改**按需跨闸调用**（L3 批量 / 门禁异常 / 台账重建，
#   见 members.ppt-producer.spawn 与 routing.L3）。刻意不把它写进 stages.*.members，
#   否则会改变 stage 成员集合与 L2/L3 spawn 计划的语义。

# ── 成员注册表：职责、工具白名单、降级通道 ────────────────────
# 工具白名单说明：WorkBuddy 专家包**不支持** agent frontmatter 的 tools 字段
# （2026-09-30 commit cd6fc41 实测确认，属平台铁律）。
# 因此最小权限靠「人设装配（assemble_spawn_prompt.py）+ 任务包约束」实现，
# 本表是主理人编排时的意图声明，供 preflight 与人工核对。
members:
  dvm-content-expert:
    duty: "证据核验与分级（唯一内容权威）"
    tools_whitelist: ["Read", "Grep", "Glob", "WebSearch", "WebFetch", "ToolSearch", "DeferExecuteTool"]
    writes_allowed: false
    spawn: "常驻（L1+ 必调）"
    fallback: "general-purpose+persona"
  pedagogy-architect:
    duty: "教学蓝图与页表教学列（含 speaker_note / page_role）"
    tools_whitelist: ["Read", "Write"]
    writes_allowed: true
    spawn: "常驻（L1+ 必调）"
    fallback: "general-purpose+persona"
  visual-slide-designer:
    duty: "高价值页人工设计 + 抽样复核裁决（红线参数与外科判据已下沉 yaml/SOP/脚本）"
    tools_whitelist: ["Read", "Write"]
    writes_allowed: true
    spawn: "常驻（L2+）；L1 按需"
    fallback: "general-purpose+persona"
  ppt-producer:
    duty: "门禁与台账的**职责保留**；v3.0.0 起不再常驻 spawn，改按需调用"
    tools_whitelist: ["Read", "Bash", "Write"]
    writes_allowed: true
    spawn: "按需（L3 批量 / 门禁异常 / 台账重建时）"
    fallback: "script_pipeline"   # 门禁本质是脚本，成员不可用时由 harness gate 直跑
  verifier:
    duty: "独立验证（V 层）：终检独立复算、裁判口径第二签、挂账审判"
    # v3.16.0 修自相矛盾：writes_allowed=true 但 whitelist 里没有 Write（能写却没工具）→ 补 Write。
    #   边界不变：只允许写**验证报告**，禁改课件（改课件属 ppt-producer / Loop B 工作副本纪律）。
    tools_whitelist: ["Read", "Write", "Bash", "Grep", "Glob"]
    writes_allowed: true          # 只允许写验证报告，不得改课件
    spawn: "按需（闸4 必调 + 口径变更时）"
    fallback: "script_pipeline"   # 无成员时退化为 harness gate + verify-artifact 组合

# ── 复杂度分级 → spawn 计划（v3.0.0：默认计划不含 ppt-producer，含 verifier）──
# v3.17.0（批次 B · Task#7）：`spawn` 的元素**一律是合法成员 ID**（取值域 = 本文件
#   `members` 的键）。此前 L1/L3 把「按需1-2名」「批量/台账」这类**说明文字塞进了
#   数组元素**（"pedagogy-architect|dvm-content-expert（按需1-2名）"、
#   "ppt-producer（批量/台账）"）——下游若按成员 ID 遍历 spawn 计划，拿到的是
#   **无法解析的伪 ID**（成员 ID 永不含中文括号/竖线/中文）。
#   ⇒ 说明语义一律移到同级 `spawn_policy` 键（人读、不参与 ID 解析）；
#     `scripts/harness.py#cmd_route` 另加**运行时校验**（伪 ID 直接报错退出，不静默透传）。
routing:
  L0: {team_create: false, spawn: [], confirm_gates: 1, spawn_policy: "不建团、不 spawn（单点直办）"}
  L1: {team_create: true,  spawn: ["pedagogy-architect", "dvm-content-expert"], confirm_gates: 2, spawn_policy: "按需1-2名（主理人按任务性质取舍，从上述候选中挑）"}
  L2: {team_create: true,  spawn: ["pedagogy-architect", "dvm-content-expert", "visual-slide-designer", "verifier"], confirm_gates: 2, spawn_policy: "全员常驻（ppt-producer 不常驻——门禁类按需跨闸调用，见 members.ppt-producer.spawn）"}
  L3: {team_create: true,  spawn: ["pedagogy-architect", "dvm-content-expert", "visual-slide-designer", "verifier", "ppt-producer"], confirm_gates: 2, red_team: true, spawn_policy: "全员常驻；ppt-producer 仅在批量制作/台账重建场景加入"}

# ── 降级协议（v2.2.0 新增：成员不可调度时不再整链阻断）──────────
fallback:
  max_spawn_attempts: 2            # 同一成员最多尝试 2 次（原实测 3 次全失败且无止损）
  on_unavailable: "degrade"        # degrade | block —— 默认不再 block
  degrade_modes:
    general-purpose+persona: "spawn 通用子代理，并在任务包开头注入该成员 MD 全文（人格+红线）"
    script_pipeline: "改由 scripts/ 下确定性脚本直接执行（仅适用 ppt-producer 门禁类职责）"
  require_disclosure: true         # 降级必须在交付物与 trace 中显式声明，禁止静默

# ── 预算护栏（任务级，宿主 maxTurns 之外的真正约束）────────────
budgets:
  max_member_spawns: 8             # 单任务累计成员调度次数
  max_spawn_attempts_per_member: 2
  max_react_rounds_per_gap: 3      # 严真奥单条证据缺口
  max_react_rounds_total: 15
  max_rework_rounds_per_stage: 2
  max_stage_minutes: 20            # 单阶段挂钟上限（超时 → 上报，不等死）
  max_artifact_bytes: 60000        # 单个成员产物字节上限；超限强制"只传路径+摘要"
  # v3.16.0 删除（防双重声明静默失效）：此处曾有 three_source_sample_rate /
  #   three_source_pass_threshold 两键，与 domain_config.yaml#three_source_check 同值重复声明，
  #   而真正被代码消费的只有后者（verify_deck.py#_load_three_source_thresholds 读它）——
  #   调参者改本文件会以为生效，实际不变。
  #   ⇒ 三源阈值唯一源 = config/domain_config.yaml#three_source_check，此处不再重复声明。
  #   查询入口仍在：`harness.py budget --kind three_source_sample|three_source_pass`，
  #   其 executed_by 指向真实执行者（verify_deck.py），config_source 指向 domain_config.yaml。

# ── 快照策略（v3.3.1 治理批新增：痛点①备份膨胀的对症段）────────
# 缘由（2026-10-14 诊断实测）：snapshot.py 自 Batch 2 就绪但 .snapshots/ 从未初始化，
#   AI 迭代产物以 _v2_v3 旁路文件堆积（消毒剂使用规范-优化版E_v2_v3.pptx 实证），
#   课程工作区 14G 中约半数为可再生/可归档内容。
# 原则：**唯一活跃版 + 原始件双轨**——AI 修改课件原地写回（禁旁路新文件），
#   写回前自动 snap；原始课件（非 AI 产物）永不覆盖，只读引用。
snapshot:
  enabled: true                    # 总开关（false 时 harness 跳过自动 snap）
  max_mb: 6000                     # 快照库容量上限（LRU 淘汰，milestone 永久保留不计入）
                                   # v3.4.3 C3（裁决3-B）：500→6000——5.5G 实际水位是 v3.4.2 P2-3
                                   # 的"基线永久"有意决策（见下注），非意外膨胀；上限对齐设计
                                   # 以消除体检误报，未删任何快照。未来磁盘受限可按下行注释降级。
  keep: 3                          # 每课件保留 K 份（里程碑点永久除外）
  auto_snap_on_writeback: true     # ppt-producer 写回前自动打点（trigger=auto_pre_writeback）
  milestone_tags_permanent: true   # milestone 类快照不参与 LRU
  first_snap_targets: "194"        # 启用当日对全部存量课件打首版快照（baseline-v3.3.1）
  # v3.4.2 P2-3 备注：当前 .snapshots 5.6G 超出 500M 上限，但所有快照均标 baseline-v3.4.2
  #   milestone tag 永久保留。如下游工作区磁盘受限，可手动编辑此字段 max_mb 调高或
  #   关闭 milestone_tags_permanent 让 GC 生效——本工作区选择"基线永久"以保首次收编可回滚。

# ── 上下文压缩（隔离：主理人不吃全文）─────────────────────────
context:
  handoff_mode: "path_only"        # path_only | summary | full
  summary_max_chars: 800           # 成员回传摘要上限；全文只落盘、不进对话
  state_max_bytes: 32768           # task_state.json 体积上限，超限触发 compaction
  # v3.18.0 G6：stage_history 的保留条数（`state compact` 裁剪时只留最近 N 条）。
  #   依据：stage_history 是状态文件**唯一无上限增长**的键（每次 `state set --stage`
  #   追加一条），历史上撑爆状态文件的就是它。默认 10 条足够回看最近几闸。
  state_history_keep: 10
  state_allowed_keys:              # 白名单外的键一律拒绝写入
    - task_id
    - workflow
    - current_stage
    - stage_history
    - user_confirmations_pending
    - tool_probe_results
    - budget
    - next_action
    - compaction
    # v3.16.0 联动登记：quality_history（每轮 P0/P1/P2 质量快照，供"连续 N 轮无质量进展"
    #   收敛判据消费——见 loop_b.budgets.no_progress_threshold）。
    #   ⚠ 白名单外的键会被 `state set` 静默拒绝（cmd_state:305），新增状态键必须同步登记此处，
    #     否则写入失败且无提示；loopB_state.json 不走本白名单，但主理人把快照镜像到
    #     task_state.json 时依赖本项。
    - quality_history
    # v3.17.0 联动登记：collapse（域坍缩产物 + 确认状态）。
    #   ⚠ 白名单外的键写入会被 `state set` **静默拒绝**（cmd_state 的 allowed 检查），
    #     新增状态键必须同步登记此处，否则写入失败且无提示。
    #   结构见 harness.yaml#collapse 与 scripts/harness.py#cmd_collapse。
    - collapse

# ── 闸1 冻结清单（用户逐条确认后才生效）─────────────────────────
# 背景（v3.17.0 实测缺口，非假设）：闸1 是 `user_confirm` 门（stages.0.gate），
#   但此前**没有任何机器可读的地方列出"闸1 到底冻结了哪几项"**——
#   确认对象散落在 references/course-profile-defaults.md 与 task-intake-checklist.md 的散文里，
#   于是「选哪些专家 / 哪个域」从未被提交用户确认也无人察觉。
# 本清单把闸1 的冻结项**显式化**，供主理人逐条提交、供机器核对"是否该确认的都确认了"。
gate1_freeze:
  - id: audience
    label: "受众（分层与深度档位）"
    required: true
    source: "references/course-profile-defaults.md#1"
  - id: hours
    label: "课时（时长与页数口径）"
    required: true
    source: "references/course-profile-defaults.md#2"
  - id: template
    label: "模板（版式指纹与硬约束）"
    required: true
    source: "references/default-template-profile.md"
  - id: scope
    label: "处理范围（逐页六查）"
    required: true
    source: "references/course-profile-defaults.md#3"
  - id: acceptance
    label: "验收标准（内容 5 条 + 视觉 7 条 + 差异化阈值）"
    required: true
    source: "references/course-profile-defaults.md#4"
  # ── v3.17.0 新增第 6 项：**选哪些专家 / 哪个域**此前从未提交用户确认 ──
  - id: collapsed_team_config
    label: "已坍缩的专家团配置（域 id + 角色人格 + 选型理由）"
    required: true
    source: "config/domain-profiles.yaml + 坍缩产物（route --domain 落盘 → collapse confirm）"
    note: "未确认前域人格**不生效**（脚本只组装、落盘待确认态，不注入人格）"
  # ── v3.19.0 新增第 7 项：**PPT 交付语言**（维度 6）────────────────
  - id: delivery_language
    label: "交付语言（默认中文 + 术语中英标注 + 英语场景判据）"
    required: true
    source: "config/language-profile.yaml"
    note: "PPT 默认语言为中文；关键术语首现按「中文（English, Abbreviation）」标注；受众为全英文授课/留学生班时可产出英语 PPT"
  # ── v3.19.0 新增第 8 项：**知识库/外部通道路由**（维度 10/13）────
  - id: knowledge_channel
    label: "知识库与外部通道路由（库归属 + 通道可用性 + 可更换提醒）"
    required: true
    source: "config/external-tools.yaml"
    note: "知识库组**仅动物医学专业**可用；其他专业须**主动提醒**用户更换/更新；库属其他专业时**阻断**"

# ── 坍缩（把「用哪个域 / 哪些专家」坍缩成一份可确认的专家团配置）────
# 规格原文：「坍缩结果须**主动输出**并与我对齐、**经确认后生效**」。
#   本节把"待确认 → 已确认"的状态机与落盘位置写死成配置，脚本只执行不判断。
collapse:
  enabled: true
  profile_file: "config/domain-profiles.yaml"     # 域档案唯一数据源（域之间只差档案、不差代码）
  artifact_dir: "_collapse"                        # 相对 RUN_DIR（与 _search_requests/ 同级同风格）
  artifact_name_template: "collapse_{task_id}_{domain_id}.json"   # 带域 id：同一任务可并存多个域的坍缩产物，互不覆盖
  pending_status: "pending_confirmation"           # 未确认态：域人格**不生效**
  confirmed_status: "confirmed"                    # 已确认态：可生效
  require_user_confirmation: true                  # 硬承诺：未确认不得生效
  # 确认命令（人读，执行方 = 主理人；**沉默不构成确认**）
  confirm_command: "python3 scripts/harness.py collapse confirm --id <域id> --task-id <task_id> --workspace <工作空间>"
  # 选型理由由**主理人（LLM）**填写，脚本不猜——未填时坍缩产物标记为待补
  rationale_filled_by: "team-lead"

# ── 可观测性 ────────────────────────────────────────────────
observability:
  trace_file: ".workbuddy/harness_trace.jsonl"   # 追加式 JSONL，每事件一行
  # v3.16.0：登记 no_progress（连续 N 轮无质量进展，见 loop_b.budgets.no_progress_threshold）。
  #   注：本清单当前无校验器强制（属登记性声明），事件由 _loop_dispatch(continue) 写出。
  # v3.17.0 B3-2（本轮实测修正）：此前本清单声明 12 个事件，实测**只有 5 个有代码产出**
  #   （gate / stage_enter / stage_exit / budget_exceeded / no_progress），7 个是纯声明——
  #   其中 degrade 缺席的代价是**立项级**的：同文件 fallback.require_disclosure=true
  #   声明"降级必须在交付物与 trace 中显式声明"，而 degrade 无产出 ⇒
  #   "降级是否发生、是否被声明"在 trace 里根本查不到（v2.2.0 建 harness 层的原始理由被自己重犯）。
  #   ⇒ 本轮为 12 个事件**逐个补上代码产出点**（见 scripts/harness.py 的产出点注释）：
  #     team_create   ← route（路由判出要建队时）
  #     preflight     ← preflight（开工前可用性预检）
  #     spawn         ← spawn（spawn 成功）
  #     spawn_failed  ← spawn-failed（spawn 失败/不可用）
  #     degrade       ← degrade + preflight（检出平台已回落成通用子代理时）
  #     member_return ← member-return（成员回传登记）
  #     error         ← main() 顶层异常出口（此前异常只打栈、trace 里查不到）
  #   ⛔ 事件名是**声明与代码的契约**：改这里的名字 = 同时改产出点，否则
  #     `trace report` 的 declared_events_missing / undeclared_events 会立刻报出来。
  # v3.18.0 G6：新增 compaction ← `state compact`（状态压缩）。此前 `state validate`
  #   报「状态文件 N bytes 超过上限，必须 compaction」，但**全包无 compaction 实现**，
  #   那句报错没有下文；现在它对应一条真命令，压缩动作也必须留痕（压前/压后字节 + 丢了什么）。
  trace_events: ["team_create", "preflight", "spawn", "spawn_failed", "degrade",
                 "member_return", "gate", "stage_enter", "stage_exit", "budget_exceeded",
                 "error", "no_progress", "compaction"]
  report_on_finish: true

# ── 增量门禁（v3.5.0：改造类任务的验收基准 = 自引入缺陷 0，不是绝对红灯 0）──
# 经验来源：一次多轮增补实战中，成品 P0=6 与改造前基线完全相等（自引入 0），但按绝对数口径
#   会被误判为"施工产出 6 条红线"；反之，用"存量也有"掩盖自引入同样不可接受。
delta_gate:
  baseline_required: true          # 改造/增补类任务施工前必记基线；基线缺失 = 报告不合格
  baseline_fields: ["p0", "p1", "p2", "pages_physical", "pages_visible", "md5"]
  block_on_new_defects: true       # 自引入 P0/P1 > 0 → 阻断；存量缺陷挂账不阻断
  report_format: "P0=6（基线 6，自引入 0）"   # 只报绝对数的报告视为不合格，退回复算
  miss_needs_human_review: true    # 机器 MISS 未经规范化复核不得计入缺陷、不得升 P0
  # v3.6.0（迭代五/六原则的机器背书段）：
  insert_spatial_audit: true       # 向既有页插入新元素前必须枚举目标区全部形状区间，重叠率 0% 才准插
  insert_font_at_creation: true    # 新元素文字规格创建时即达合规（正文≥12pt），禁"先插后调"两步走
  image_caption_requires_reading: true  # 图像类图注/讲稿必须先逐张判读图像本体；判读不出不得写
  caption_missing_element_policy: "explicit_todo"  # 图注要素缺项必须显式挂账，禁静默省略

# ── 双层 Loop 隔离（v3.8.0 增补 B）───────────────────────────
# 背景：Loop A（改专家团工程）与 Loop B（处理用户真实课件）此前共用
# task_state.json，授权边界模糊——易把"确认升级指令"误读为"授权处理课件"。
# 处置：两个 Loop 各自独立状态文件 + 独立授权域，互不触发。
loop_a:
  enabled: true                   # 总开关
  trigger: "管家节点下达的专家团升级/修复指令"
  state_file: "<包>/.workbuddy/loopA_state.json"
  scope:                          # 允许触碰的目录（白名单，越界即越权）
    - "<包>/scripts"
    - "<包>/config"
    - "<包>/references"
    - "<包>/agents"
  forbidden_paths:                # 绝对禁区：Loop A 任何行为不得触碰用户课件目录
    - "<工作区>/**/*.pptx"
    - "<工作区>/**/*.ppt"
    - "<工作区>/.workbuddy/artifacts"
  patch_discipline: "minimal"     # 只围绕已核验真实缺口做最小补丁
  confirm_before_each_batch: true # 每批修改前必须向管家节点确认
  regression_required: ["ensure_settings", "test_harness", "test_five_gates"]

loop_b:
  enabled: true
  trigger: "管家节点点名某份已有 PPT 要求优化/深化"
  state_file: "<工作区>/.workbuddy/loopB_state.json"
  coexist_with: "<工作区>/.workbuddy/task_state.json"   # 并存，不覆盖（五道闸状态机语义不变）
  single_writer: "team-lead"      # 单写者：成员不得直接写状态文件，回传由主理人汇编落盘
  original_readonly: true         # 原件只读；工作副本 <name>_wip/ 迭代；最终另交新版
  round_review:
    required: true                # 每轮必须停等用户确认（references/round-review-sop.md）
    silent_is_not_approval: true  # 沉默/超时/成员自评均不构成确认
    partial_accept_freezes_only_named: true  # 部分接受只冻结被点名条目
    rework_stays_in_round: true   # 返修仍属当前轮，不进位
    invalidation: "sha256"        # 内容文件哈希变化 → 该条目批准自动失效，须重审
  budgets:                        # 全部可调；达上限只暂停报告，禁止宣布通过
    max_rounds: 8
    max_items_per_round: 5        # v3.8.0 N3：每轮条目上限（小批是让用户真正读完的关键）
    retrieval_budget_per_round: 30
    # v3.16.0：此前本键**零命中**（scripts/ 下无任何读取者，配了但无执行者）→
    #   现由 harness.py#_loop_dispatch(continue) 消费：每轮结束记 P0/P1/P2 快照，
    #   连续 N 轮 P0+P1 合计未下降即触发终止建议（exit 1 + trace 事件 no_progress）。
    no_progress_threshold: 2
    max_rework_per_item: 2
  # v3.16.0：补质量维度终止原因（原五类全是工作量/交互维度，机器检不出"缺陷数已不再下降"）
  termination: ["成功完成", "等待用户", "能力或证据阻塞", "达到预算但未完成",
                "用户取消", "连续 N 轮无质量进展"]
  # v3.10.0：用户已确认的接单默认（覆盖须在 intake 显式记录并置 confirmed）
  defaults:
    profile_ref: "references/course-profile-defaults.md"   # 受众四层 / 课时映射 / 范围 / 验收矩阵
    audience_schema: "references/audience-profile-schema.yaml"  # v3.11.0：受众分层单一数据源（勿另立定义）
    template_ref: "references/default-template-profile.md" # 默认模板指纹 5fa78154 + 三条硬约束
    delivery_ref: "references/delivery-spec.md"            # 交付三件套 schema
    # v3.11.0：默认受众 = 职业本科与本科生（合并层）；四层枚举见 audience_schema
    audience: "职业本科与本科生（默认）；可切 大专 / 基层兽医及一线技术人员 / 研究生"
    audience_depth_scale: ["了解", "理解", "掌握"]   # 取自国家教学标准的行为动词，非自造
    # v3.11.0：课内时间结构（四层统一，不由受众变化）
    time_structure: {lecture_pct: 90, case_pct: 5, interaction_pct: 5}
    hours_per_session: "1-4 课时 × 45min；页数口径见 course-profile-defaults.md#2（唯一源）"
    scope: "全部页面，逐页六查（标题层级/正文表述/图表/案例/思考题/小结）"
    # ── v3.18.0：默认模板改为**空值 + 运行时校验**（解耦个人机器路径）──
    # 缺陷（2026-10-25 从零诊断 G5 实测）：原值硬编码个人 OneDrive 绝对路径
    #   `/Users/biodog/.../禽病防治技术PPT模板.pptx`——换机器/换用户即失效，
    #   而它是**闸1 冻结项**（gate1_freeze.template，required: true），
    #   且 V1 页眉 / V3 取色等验收判据全挂在它上面（references/default-template-profile.md）。
    #   该行还**不在任何 DOMAIN_EXAMPLE 哨兵块内**（与 ppt-producer.md 同路径的处置不一致）。
    # 处置：**模板路径属"用户现场资产"，不属包内默认**。
    #   · 本键置 null —— 表达"包内不预置任何具体模板文件"；
    #   · 模板约束（三条硬约束 + 指纹 + GEO-003 基线用法）仍留在
    #     references/default-template-profile.md（**唯一源**，人读+脚本引用）；
    #   · 实际路径由**工作区模板登记册**提供：<工作区>/.workbuddy/templates/template_registry.json
    #     （见 references/template_registry_usage.md 与 scripts/template_migrate.py register/audit）。
    #   · 运行时缺模板 → **显式报"模板待提供"并阻断闸1**，不静默回落到任何个人路径。
    default_template: null
    # 模板约束档案（包内唯一源，含三条硬约束与 GEO-003 基线用法）
    template_profile_ref: "references/default-template-profile.md"
    # 模板指纹：随档案记录，实测值（sha256(clrScheme+fontScheme)[:8]）
    template_fingerprint: "5fa78154"
    keep_original_layout: true    # 已有原稿版式的沿用原稿，不强制迁到默认模板
    geo_baseline_required: true   # 成品 lint 必配 --geo-baseline，否则 V7 无法判定

# ── 门禁退出码语义（主理人据此分流，不再一律"打回"）────────────
gate_exit_codes:
  0: "通过"
  1: "P0 硬阻断——禁止写回，先组织修复"
  2: "P1 阻断——可带修复计划写回，交付前清零"
  3: "P2 阻断——备注覆盖率未达标"
  4: "运行错误——脚本/文件问题，非课件质量；必须报 traceback 并走缺陷回流，不得当作红灯打回成员"
