# domain_config.yaml — 学科域配置（v3.2.0-batch5 抽离）
# ══════════════════════════════════════════════════════════
# v3.3.0 立项依据：v4 通用化战略要求 domain 集中可配。
# 原 DISEASE_MAP（case_extract.py）/ domain=animal-medicine/家禽（4 agent MD 描述）
# 散落 5+ 文件，新增/修改 domain 需改多处。本文件为唯一源。
#
# 消费方：
#   - scripts/case_extract.py（DISEASE_MAP 读本文件，标 deprecated 兜底）
#   - scripts/verify_deck.py（--three-source-check 模式读 domain 列表）
#   - 4 个 agent MD 描述（用 ${domain} 占位符，v3.3.0+ 装配时替换）
#   - teams/vet-med-ppt-team/config.json（domain 字段同步）
#
# 覆盖机制：<workspace>/.workbuddy/domain.yaml 可覆盖本文件（团队级定制）

version: "3.23.0"
# ── 学科域清单（v3.3.0 默认 4 个） ───────────────────────────
# Q2 默认：animal-medicine / microbiology / pet / tcm-vet
domains:
  - id: animal-medicine
    label_zh: "动物医学"
    label_en: "Animal Medicine"
    default_disease_module_prefix: "M[1-7]"   # 课件父目录匹配正则
    case_id_prefix: "C"                        # case_id 格式 C-<模块>-<3位>
    active: true
    notes: "原 'animal-medicine/家禽' 拆分为'动物医学'顶级 + 子分项"

  - id: microbiology
    label_zh: "微生物学"
    label_en: "Microbiology"
    default_disease_module_prefix: "M8"        # 微生物课件统一 M8 开头
    case_id_prefix: "C"
    active: true
    notes: "v3.3.0 新增；首批打样 1 件（M8A1 细菌学总论）"

  - id: pet
    label_zh: "宠物医学"
    label_en: "Pet Medicine"
    default_disease_module_prefix: "P[1-9]"   # 宠物课件 P 开头
    case_id_prefix: "C"
    active: false                              # v3.3.0 仅占位不启用
    notes: "v3.4.0 拟启用"

  - id: tcm-vet
    label_zh: "中兽医"
    label_en: "Traditional Chinese Veterinary"
    default_disease_module_prefix: "T[1-9]"   # 中兽医 T 开头
    case_id_prefix: "C"
    active: false                              # v3.3.0 仅占位不启用
    notes: "v3.4.0 拟启用"

