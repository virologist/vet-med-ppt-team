# ── 三源核验配置（Q6 ≥80% 阈值） ────────────────────────────
# v3.16.0：**本段是三源阈值的唯一源**。harness.yaml#budgets 里的 three_source_sample_rate /
#   three_source_pass_threshold 已删除（曾与本段重复声明，改那边不改行为 → 静默失效）。
#   消费方：scripts/verify_deck.py#_load_three_source_thresholds()（执行者）、
#           scripts/harness.py#_load_three_source_thresholds()（查询者，budget --kind three_source_*）。
#
# v3.17.0（B2-1）：本段同时成为**三档判定语义**的唯一源。
#   立项依据（独立诊断组实跑攻击复现）：闸4.5 此前只判 `src.ok is True` 这一个
#   **自报布尔值**，无任何存在性校验——造 3 条来源（不存在的 PMID + 不存在的 ISBN
#   + 不存在的 GB）把 ok 写成 true，闸4.5 输出 pass_rate=1.0 / verdict=pass / exit 0；
#   交叉核验该 PMID 在 PubMed esearch count=0（根本不存在）。
#   ⇒ 判据必须从"自报"改为"实查"，且**查得到不等于通过，查不到更不等于通过**。
#
# ⚠ v3.17.0 收尾（已知环境约束，非实现缺陷，**别当 bug 报**）：
#   ① **批量清单跑不完是环境约束**：NCBI 对**无 key 的匿名访问**有 3 req/s 速率限制，
#      连续批量请求会被 NCBI abuse 系统封禁（返回 Access Denied / 429，部分网络
#      路径下表现为 SSL EOF）。代码侧已做：api_key 支持 + 限速可配 + 遇速率限制
#      指数退避并**显式告警**（见 source_verification.pubmed 段）。
#      ⇒ **跑存量清单必须分批 + 批间留间隔**；有 NCBI key（设环境变量 NCBI_API_KEY）
#      可到 10 req/s，耗时约降为 1/3.5。
#   ② 遇封禁/网络失败时闸4.5 判 `network_incomplete`（fail-closed，**不静默通过**），
#      这不是误判，是"没查成 ≠ 查过"。处置：配 key 或放慢节奏重跑，不要改成放行。
three_source_check:
  enabled: true
  sample_rate: 0.1            # 抽检 10%
  pass_threshold: 0.8          # 通过率 ≥80% 达标
  # v3.17.0：抽检可复现（null=每次随机；填整数则固定种子，便于"存量核验清单"复跑同批案例）
  sample_seed: null
  sources:
    - kind: pubmed
      label: "PubMed 检索（PMID）"
    - kind: textbook
      label: "教辅/规划教材（ISBN）"
    - kind: regulation
      label: "国标/公告（GB/公告号）"
  # ⚠ v3.17.0 收尾：上面三行 label **现在被代码真读**（报告里显示来源类型名，
  #   见 scripts/harness.py#_source_labels）——此前是"配了无人读"的死配置键
  #   （体检第 18 项 INFO 提示）。改 label 会真实改变报告输出，不是装饰字段。

  # ── 三档判定语义（唯一源）────────────────────────────────────────
  # 每条来源按 kind 走各自核验方式，归入且仅归入三档之一：
  #   existence_verified 存在性已验证 —— 联网实查命中（当前仅 pubmed 具备该能力）
  #   format_only        仅格式合规   —— 校验位/编号格式通过，**未验证存在性**
  #   unverifiable       不可核验     —— 无核验器 / 格式不过 / 联网失败
  # 硬约束：判定**不读 src.ok / src.verified_at**——自报布尔值不构成证据。
  tiers:
    existence_verified: "存在性已验证"
    format_only: "仅格式合规"
    unverifiable: "不可核验"

  # ── 每案例判定（"三源"的字面含义）──────────────────────────────
  # ① required_kinds：三类来源必须**齐备**，且每类至少 1 条达到
  #    「存在性已验证」或「仅格式合规」（格式不过的条目不算该类已提供）。
  #    —— 直接堵死"只留 1 条来源也能 pass"的旁路。
  # ② required_existence_verified：其中至少 N 条达到「存在性已验证」。
  #    —— 这是"已验证"的唯一口径；「仅格式合规」**不计入**已验证。
  required_kinds: ["pubmed", "textbook", "regulation"]
  required_existence_verified: 1
  # 联网核验失败（网络/端点异常）单独计数 + 显式告警；不得算作"已验证"，
  # 且整轮不得判 pass（block=阻断；warn=只告警不阻断，但本版只用 block）。
  network_failure_policy: "block"

  # ── 各 kind 的核验方式（端点/时限/限速一律落 yaml，代码只执行）────
  source_verification:
    pubmed:
      mode: "online_esearch"     # 真实存在性核验：PubMed esearch 按 uid 查
      endpoint: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi"
      db: "pubmed"
      timeout_seconds: 15
      # ── 限速（可配）─────────────────────────────────────────────────
      # NCBI 官方速率：**无 key 3 req/s，有 key 10 req/s**。本项是"每次请求后
      # 固定 sleep"，默认 0.4s ≈ 2.5 req/s（留安全余量，**不得调慢**——调慢会
      # 改变既有耗时预期）。有 key 时可用更快的节奏（见 rate_limit_sleep_with_key）。
      rate_limit_sleep: 0.4
      rate_limit_sleep_with_key: 0.11   # 有 key 时 ≈9 req/s（仍在 10 req/s 内）
      # ── API key（**真值只从环境变量读，严禁写进包内任何文件**）──────
      # yaml 里只放**环境变量名**；代码 os.environ.get(该名字)。
      # 留空串 = 不用 key（按匿名 3 req/s 跑，批量清单易触发 NCBI 封禁）。
      # 申请：https://account.ncbi.nlm.nih.gov/settings/  → API Key Management
      api_key_env: "NCBI_API_KEY"
      # ── 退避（遇速率限制时指数退避，**每次退避都显式告警**，不静默重试）──
      # max_retries: 单个 PMID 的退避重试次数（0=不重试，直接记网络失败）
      # backoff_base: 首次退避秒数；之后 ×2 指数增长
      # backoff_cap: 单次退避上限秒数
      # suspect_threshold: 连续多少次非 HTTP 类失败后判为"疑似触发速率限制"
      #   （NCBI 封禁在部分网络路径下表现为 SSL EOF 而非 403，见下）
      max_retries: 3
      backoff_base: 2.0
      backoff_cap: 30.0
      suspect_threshold: 2
      # abort_batch_on_rate_limit: 某条 PMID 因速率限制重试耗尽 = 端点/限速对整批
      #   都不可用 → 中止本批剩余 PMID 的实查（不再发请求，剩余全记网络失败）。
      #   否则封禁时每条 PMID 都要赔 2+4+8 秒退避，整批清单拖到无法忍受。
      #   被中止的条数**显式告警**，上层按 network_error 计数 → fail-closed。
      abort_batch_on_rate_limit: true
    # ── textbook（ISBN）：v3.17.0 B3-3 **接入真实存在性端点** ────────
    # 立项依据（CHANGELOG 已知瑕疵 #1）：此前 textbook 只有 isbn_checksum
    #   （校验位算法），**永远只到「仅格式合规」档**——校验位能证明"这串数字
    #   算得通"，不能证明"真有这本书"。
    #
    # v3.17.0 实测接入两个**现查可达**的端点（均已实际发请求验证，证据见 CHANGELOG）：
    #   ① 国家图书馆联合目录（opac.nlc.cn）——中文书目权威源，按 ISBN 字段精确检索
    #      （find_code=ISB）；命中即"该 ISBN 在国家图书馆书目库中存在"。
    #      ⚠ 实测特性：**命中页比未命中页大约多 30KB**（多出书目记录块），
    #        且未命中页含固定文案「数据库里没有这条请求记录」→ 代码据此判定命中。
    #      ⚠ 该端点有速率限制：连续请求会返回空响应（实测连发即被限）。
    #        故 rate_limit_sleep 取 1.5s（保守），网络失败判 network_error（fail-closed）。
    #   ② OpenLibrary search API（openlibrary.org）——按 isbn: 精确查，
    #      返回 numFound + 书名/出版年。⚠ 实测**中文书覆盖稀疏**
    #      （3 个真实中文兽医学教材 ISBN 只 1 个命中；3 个随机伪造 ISBN 全不命中，
    #        即**无假阳性**）→ 作为**第二端点**，命中即可证实存在；
    #        未命中**不构成证伪**（覆盖不足 ≠ 书不存在）。
    #
    # ⚠ 判定纪律（**不能核验的字段不得计入已验证**）：
    #   · 任一端点**命中** → 存在性已验证（existence_verified）
    #   · 两端点**均未命中** → 判「不可核验」并显式告警（**不判证伪**：
    #     未命中只说明"这两个库的覆盖里没有"，不等于"这本书不存在"）
    #   · 网络失败 → network_error（fail-closed，不计入已验证）
    textbook:
      mode: "isbn_online"         # v3.17.0 B3-3：由"仅格式合规"升级为"可实查存在性"
      format_fallback: "isbn_checksum"   # 联网失败时退回格式校验（仍不计入已验证）
      timeout_seconds: 25
      rate_limit_sleep: 1.5       # 实测 opac.nlc.cn 连发即限速 ⇒ 保守取 1.5s
      max_retries: 2
      backoff_base: 3.0
      backoff_cap: 20.0
      endpoints:
        - id: "nlc_opac"
          label: "国家图书馆联合目录（按 ISBN 精确检索）"
          url: "http://opac.nlc.cn/F/?func=find-b&find_code=ISB&request={isbn}&local_base=NLC01"
          method: "GET"
          # 命中判据（实测）：未命中页含此固定文案；命中页不含
          absent_marker: "数据库里没有这条请求记录"
          # 命中时页长显著大于未命中页（实测 60KB vs 30KB）——作二级判据
          min_hit_bytes: 45000
        - id: "openlibrary"
          label: "OpenLibrary Search API（按 ISBN 精确检索）"
          url: "https://openlibrary.org/search.json?q=isbn:{isbn}&fields=isbn,title,publish_year,publisher&limit=1"
          method: "GET"
          json_hit_path: "numFound"    # >0 即命中
          json_hit_min: 1

    # ── regulation（GB 国标号 / 公告号）：v3.17.0 B3-3 **接入真实端点** ──
    # 立项依据（CHANGELOG 已知瑕疵 #1）：此前 regulation 只有 gb_number_format
    #   （编号格式正则），**永远只到「仅格式合规」档**。
    #
    # v3.17.0 实测接入**全国标准信息公共服务平台**（std.samr.gov.cn，市场监管总局）：
    #   endpoint = /gb/search/gbQueryPage?searchText={标准号}&current=1&size=N
    #   返回 JSON：{total, rows:[{C_STD_CODE, C_C_NAME, STATE, ISSUE_DATE, ACT_DATE}]}
    #   ⇒ **可核验的字段（本包只把确实拿到的字段计入已验证）**：
    #     · 该标准号**是否存在**（total/rows 命中）
    #     · **现行状态**（STATE：现行 / 废止 / 被代替 / 即将实施）——这是本包
    #       此前完全拿不到的关键字段：引用一条**已废止**的标准是真错误，
    #       此前格式校验完全查不出来。
    #     · 标准名称（C_C_NAME）、发布日期（ISSUE_DATE）、实施日期（ACT_DATE）
    #   ⚠ 实测特性（**必须按实测语义实现，不得想当然**）：
    #     · 检索是**按标准号前缀**匹配的，不是按"号-年"精确匹配：
    #       查「GB 17574-1998」→ 命中 GB/T 17574-1998（现行）；
    #       查「GB 10648-2008」→ total=0（该平台只登记了 10648-1999[废止]
    #       与 10648-2013[现行]）；查「GB 10648」→ 两条全返（含废止态）。
    #     ⇒ 代码据此判定：**按标准号命中即存在**；再从命中行里找**号+年份完全
    #       一致**的那条，取其 STATE/日期；若只有同号不同年，则按"该号存在、
    #       但此年份版本未登记"处理（判 format_only + 显式告警，不谎报"完全一致"）。
    #     · 返回的 C_STD_CODE 夹着 <sacinfo> 标记（如 `<sacinfo>GB</sacinfo>/T
    #       <sacinfo>17574-1998</sacinfo>`）→ 代码须先剥标记再比对。
    #   ⚠ 覆盖边界（**实测确认，不得夸大**）：该端点只覆盖**国家标准（GB/GB-T）**，
    #     **不覆盖**行业标准（NY/T 等，实测查 NY/T 1167-2006 → total=0）
    #     与**公告号**（实测查公告 → total=0）。故：
    #     · 公告号（公告X号）仍走格式校验档 + 显式登记"人工核验项"（见下）。
    regulation:
      mode: "gb_online"           # v3.17.0 B3-3：由"仅格式合规"升级为"可实查存在性+状态"
      format_fallback: "gb_number_format"   # 联网失败/非国标号时退回格式校验
      timeout_seconds: 25
      rate_limit_sleep: 1.0
      max_retries: 2
      backoff_base: 3.0
      backoff_cap: 20.0
      endpoint: "https://std.samr.gov.cn/gb/search/gbQueryPage"
      query_param: "searchText"    # 标准号检索参数（实测唯一有效名）
      page_size: 10
      # 命中判据（实测）：JSON 的 total > 0 且 rows 非空
      json_hit_path: "total"
      json_hit_min: 1
      # 从命中行取的字段（**只把确实拿到的字段计入已验证**）
      field_code: "C_STD_CODE"     # 标准号（含 <sacinfo> 标记，代码须剥）
      field_name: "C_C_NAME"       # 标准名称
      field_state: "STATE"         # 现行/废止/被代替/即将实施
      field_issue_date: "ISSUE_DATE"
      field_act_date: "ACT_DATE"
      # 命中后判定"号+年份完全一致"时，比对用的标记剥离正则
      strip_markers: "<sacinfo>|</sacinfo>"

  # ── 格式校验规则（确定性结构校验：校验位算法 + 编号格式）─────────
  # 正则落 yaml，代码只读取与执行（禁硬编码）；yaml 缺失 → 该 kind 判「不可核验」并告警，
  # 不用内置正则兜底（内置兜底 = 又一份"看起来生效其实没生效"的声明）。
  format_rules:
    pmid: '(?i)^PMID:\s*(\d+)$'
    isbn_candidate: '(?:97[89][0-9]{10}|[0-9]{9}[0-9Xx])'
    gb_number: 'GB\s*(?:/T|/Z)?\s*[0-9]+(?:\.[0-9]+)?(?:\s*[-—]\s*[0-9]{4})?'
    announcement_no: '(?:公告|通告)\s*(?:第)?\s*[0-9]{1,5}\s*号'

# ── 5 闸扩展（Q1 追加 stage 4，v3.3.0 起生效） ───────────────
# ⚠ **v3.23.0 口径澄清**（第三轮从零诊断 P-4，实测）：本段的 `active` / `name` /
#   `notes` 是**人读型声明**，**不是**可执行开关——scripts/ 全量无任何读取点
#   （实测 `scripts/` 内 "gates" 段 0 处读取；命中的全是另一个键 `confirm_gates`
#   与测试文件名 `test_five_gates.py`）。
#   ⇒ **把 `active` 改成 false 不会关闭任何一闸**（假 affordance）。
#   机器判据的真实位置：`harness.yaml#gate_exit_codes`（退出码，被 cmd_gate 消费）
#   与 `verify_deck.py` 的门禁判定；本段只负责**向人说明五闸是什么**。
#   处置口径与 `legacy_compat` 一致：登记为人读型，不假装是开关。
gates:
  0: {name: "闸1 任务冻结", active: true,  legacy_compat: true}
  1: {name: "闸2 设计",     active: true,  legacy_compat: true}
  2: {name: "闸3 成稿",     active: true,  legacy_compat: true}
  3: {name: "闸4 交付",     active: true,  legacy_compat: true}
  4: {name: "闸4.5 案例三源核验", active: true, legacy_compat: false,
     notes: "v3.3.0 新增；双轨期 0-4 合法，旧 0-3 任务不报错"}

# ── AI 融合教学维（v3.7.0 新增，七维诊断维⑦的配置化） ────────
# 消费方：pedagogy-architect（蓝图检查 AI 元素）/ verifier（维⑦抽检）
# 量规唯一源：包内 references/seven-dimension-rubric.md（v3.17.0 内化；下游 skill 同名副本如有则以包内为准）
# 定位：建议维（P2），按课型权重浮动，不阻断不强制——AI 教学元素是增强项不是及格线
ai_literacy:
  checklist:                      # 对应 rubric 维⑦ 的 I1-I5
    - id: I1
      label: "AI 协同示范（案例环节真实应用演示）"
    - id: I2
      label: "批判性审查训练（AI 输出对照权威源找错）"
    - id: I3
      label: "AI 边界教育（法律责任/实物不可替代/时效局限）"
    - id: I4
      label: "学生 AI 任务设计（指令构建+核验要求）"
    - id: I5
      label: "讲师 AI 教学法（备注体现）"
  pass_rule:                      # 达标线：按课型取命中数
    theory: 2                     # 理论课 ≥2 项
    practicum: 1                  # 实训课 ≥1 项
    seminar: 1                    # 研讨课 ≥1 项
  severity: "P2"                  # 未达标只提示不阻断

# ── 配图抓取（v3.18.0 新增）────────────────────────────────────
# 消费方：scripts/fetch_oa_image.py（开放获取配图检索与落盘）
# 立项依据：2026-10-25 从零诊断 G3 实测——域档案登记了取图端点与许可规则，
#   但脚本侧**零实现**（无下载器、无 API 客户端）⇒ 配图能力不可复现、不可审计。
#   本段给该脚本提供**可配的退避口径**（禁硬编码）。
#   ⚠ 端点与许可**不在本段**——那两项属域档案（config/domain-profiles.yaml
#     #domains[].image_channel），域之间只差档案、不差代码。
image_fetch:
  retry:
    max_retries: 3        # 单 URL 退避重试次数
    backoff_base: 2.0     # 首次退避秒数，之后 ×2 指数增长
    backoff_cap: 30.0     # 单次退避上限秒数
  timeout_seconds: 30    # 单次请求超时（CLI --timeout 可覆盖）
  # 许可红线：license_rule 缺失或含下列标记 ⇒ **拒绝下载**，标 [待核实] 挂账。
  #   （绝不凭猜测下载或编造许可——本条与 adjudication-rules.md 原则六同源）
  license_uncertain_markers: ["待核实", "未明", "未知", "待定"]
