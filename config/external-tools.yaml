# external-tools.yaml — 外部 skill / MCP 通道唯一源
# ═══════════════════════════════════════════════════════════════════════
# v3.19.0 新增。消费方：scripts/probe_channels.py（通道探针 + 主动提醒）、
#   scripts/fetch_authority.py（L1 HTTP 通道执行 + 编排决策输出）。
#
# 立项依据（2026-10-25 第五次从零诊断·维度 10/13 实测）：
#   · 本机 44 个 MCP 服务（含 pubmed / fetch / fetch-mcp / firecrawl / tavily-search），
#     但包内对 `ima-mcp` / `mcp__pubmed` / `firecrawl` / `mcp__fetch` 的引用
#     **全部 0 命中**——全是「文档里写过」，无一条代码路径能调；
#   · 域档案登记了 7 个 Ima 库 ID，但**没有任何代码消费它**；
#   · Ima 是 **skill 形态**（非 MCP）：~/.workbuddy/skills/腾讯ima/
#     （SKILL.md + ima_api.cjs + knowledge-base/references/api.md）；
#   · 凭据环境变量 IMA_OPENAPI_CLIENTID / IMA_OPENAPI_APIKEY 本机**未设置**
#     ⇒ 7 个库 ID 目前是死数据（换账号/换机器即失效且无检测）。
#
# ★ 分层契约（L1/L2）——**本文件最重要的一条纪律**：
#   MCP 工具是**宿主会话级**工具（主理人/成员在会话里用 ToolSearch + DeferExecuteTool 调），
#   **不是 scripts/*.py 能 import 的库** ⇒ 脚本里调 MCP 是做不到的。
#   故通道按执行层分两类：
#     · layer: L1（脚本层）—— kind: http，由 scripts/*.py 直接执行（urllib）；
#     · layer: L2（会话层）—— kind: mcp_tool，由主理人/成员在会话内执行，
#                   脚本**只判定与记账**（落通道状态与证据账本）。
#   这不是缺陷，是分工宪法的必然：「谁来调」是语义问题 → LLM；
#   「调什么 / 失败了怎么办」是确定性问题 → 脚本。
#
# 纪律：
#   · 本文件是外部通道的**唯一源**；domain-profiles.yaml 的 knowledge_bases
#     **已迁出**（v3.19.0），不留两份真相；
#   · 每个通道必须有 probe（可用性探针）与 capability（能力声明）；
#   · 降级必须**显式标注能力降级**，不得静默当同等能力（ML-4「默认假绿」）。

version: "3.30.0"
# ═══════════════════════════════════════════════════════════════
# ① 联网通道（维度 13）
# ═══════════════════════════════════════════════════════════════
channels:

  # ── v3.29.0 B1：知识源五源补全（书籍/本地库/行业实践）──────────
  # 依据：outputs/升级设计_多智能体架构v4_20261107.md §六（N5 知识源总图）。
  # 总图（哪个能力域主链/次链/降级链）见本文件底部 capability_chains 与
  # references/knowledge-source-map.md（人读版 + 反幻觉三闸）。

  - id: obsidian_local
    kind: local_fs
    layer: L1
    priority: 1
    capability: ["本地知识库检索", "笔记引用（带文件路径溯源）", "书籍笔记/文献笔记"]
    probe: "path_exists"
    probe_config:
      path_env: "OBSIDIAN_VAULT_DIR"        # vault 绝对路径（环境变量，无则通道不可用）
      # 实测本机值：/Users/biodog/Library/CloudStorage/OneDrive-Personal/GPT/Obsidian（ 主库）
      fallback_env: "OBSIDIAN_VAULT_DIR_ALT"
    usage: "按主题词 grep vault（.md 全文），命中即引用，引用必须带 vault 内相对路径（闸C 溯源可逆）"
    note: "主库实测存在（OneDrive 同步，含 01-科研/ 结构）；本机无凭据问题，路径即探针"
    retry: {max_attempts: 1, backoff_base_sec: 0}

  - id: book_pdf_markitdown
    kind: local_tool
    layer: L1
    priority: 2
    capability: ["书籍 PDF→md 转换", "中英文教材全文检索底座"]
    probe: "tool_available"
    probe_config:
      command: "markitdown --help"
    usage: "PDF 转出的 .md 落 vault（或任务工作区 books/），检索走 grep；转换是**一次性预处理**，检索时不重复转换"
    fallback_for: obsidian_local
    degraded_capability: ["书籍笔记引用"]     # 未装 markitdown 时只能走人工转换，链路不中断
    retry: {max_attempts: 2, backoff_base_sec: 1.0}

  - id: sogou_wechat
    kind: mcp_tool
    layer: L2
    priority: 3
    capability: ["公众号文章检索", "行业实践/厂家方案线索"]
    probe: "tool_available"
    probe_config:
      tool_pattern: "搜狗|wechat|weixin|公众号"   # 宿主会话内 ToolSearch 探测
    usage: "⚠ 仅作**行业实践类**证据（来源等级 P4）；禁止作为科学结论唯一来源；引用必须带公众号名+文章标题+URL+抓取日期（闸C）"
    note: "L3 语义（最低优先级证据），主链是文献与书籍；本通道是 P4 类证据的补充获取面"
    retry: {max_attempts: 2, backoff_base_sec: 1.0}

  # ── 文献检索：MCP 优先 + esearch 兜底（管家节点裁决 2026-10-25）──
  - id: pubmed_mcp
    kind: mcp_tool
    tool: "mcp__pubmed__search_articles"
    layer: L2
    priority: 1
    capability: ["文献检索", "元数据", "全文", "相关文献", "按引文反查"]
    probe: "tool_available"        # 探针：ToolSearch 能否命中该工具
    note: "MCP 版能力**显著强于** esearch（有元数据/全文/相关文献/按引文反查）"

  - id: pubmed_esearch
    kind: http
    layer: L1
    priority: 2
    endpoint_ref: "config/domain_config.yaml#three_source_check.source_verification.pubmed"
    capability: ["PMID 存在性核验"]     # ⚠ 能力弱于 MCP 版（无元数据/全文）
    probe: "http_endpoint"
    fallback_for: pubmed_mcp
    degraded_capability: ["元数据", "全文", "相关文献", "按引文反查"]
    # v3.21.0（独立诊断维度 11/13）：**同通道内**的重试参数。
    # 背景：该通道此前是**单次** urlopen（scripts/fetch_authority.py:136，无 retry/attempt）
    #   ⇒ 网络抖动直接失败。同包其他通道有**跨通道**降级链（pubmed_mcp → esearch），
    #   但同一条通道内部没有重试 ⇒ 冗余编排缺一环。
    # ⚠ 只对**可重试**的错误重试：网络类异常 + HTTP 5xx + 429；
    #   **4xx（除 429）不重试**（404/403 重试也不会成功，纯浪费时间）。
    retry:
      max_attempts: 3          # 总尝试次数（含首次）
      backoff_base_sec: 1.0    # 指数退避基数：第 N 次等待 = base × 2^(N-1)

  # ── 机构权威源抓取（默沙东 / FAO / WOAH / 用户指定 URL）──
  - id: firecrawl_scrape
    kind: mcp_tool
    tool: "mcp__firecrawl__firecrawl_scrape"
    layer: L2
    priority: 1
    capability: ["URL 抓取", "PDF 抓取", "定向问答", "站点 URL 枚举", "多页爬取"]
    probe: "tool_available"
    options:
      parsers: ["pdf"]
      maxAge: 0          # ★ 0 = 实时抓。权威源**禁用缓存**
    note: "工具文档明说「成功响应本身不证明页面仍是当前版本」⇒ maxAge 必须为 0"

  - id: fetch_http
    kind: mcp_tool
    tool: "mcp__fetch__fetch"
    layer: L2
    priority: 2
    capability: ["URL 抓取"]
    probe: "tool_available"
    fallback_for: firecrawl_scrape
    degraded_capability: ["PDF 抓取", "定向问答"]

  - id: firecrawl_parse
    kind: mcp_tool
    tool: "mcp__firecrawl__firecrawl_parse"
    layer: L2
    priority: 2
    capability: ["本地文档解析"]
    probe: "tool_available"
    note: "本地 PDF/DOCX → markdown；**优先用包内 markitdown**（自带、零外部依赖）"

  # ── 书籍存在性核验（国图 / OpenLibrary）──
  - id: textbook_nlc
    kind: http
    layer: L1
    priority: 1
    # textbook 段的端点是**列表**（endpoints[]，各含 url 键）⇒ 解析器取第一个可解析项
    endpoint_ref: "config/domain_config.yaml#three_source_check.source_verification.textbook"
    endpoint_placeholder: "{isbn}"
    probe_value: "9787020002207"
    capability: ["ISBN 存在性核验"]
    probe: "http_endpoint"

  # ── 法规/标准核验（全国标准信息公共服务平台）──
  - id: regulation_samr
    kind: http
    layer: L1
    priority: 1
    endpoint_ref: "config/domain_config.yaml#three_source_check.source_verification.regulation"
    capability: ["标准号格式与存在性核验"]
    probe: "http_endpoint"

  # ── 开放获取配图（Europe PMC 补充文件）──
  - id: europepmc_supplementary
    kind: http
    layer: L1
    priority: 1
    # 取图端点**逐域不同**（写在域档案 image_channel 里）⇒ 引用路径用列表通配，
    # 探针按当前 domain_id 选对应域的通道；端点模板含 {PMCID} 占位，
    # 探针只做**可达性**判断（把占位符替换成探测用 ID）。
    endpoint_ref: "config/domain-profiles.yaml#domains[].image_channel.channels[].endpoint"
    endpoint_placeholder: "{PMCID}"
    probe_value: "PMC00000000"
    capability: ["OA 补充文件下载"]
    probe: "http_endpoint"
    per_domain: true
    note: "端点模板化（含 {PMCID}）⇒ 探针用 probe_value 占位做可达性判断"

# ═══════════════════════════════════════════════════════════════
# ② Ima 知识库（维度 10/13 核心）
# ═══════════════════════════════════════════════════════════════
# ⚠ **从 domain-profiles.yaml 迁入**（v3.19.0）——旧处已删，不留两份真相。
#   迁入理由：Ima 是**外部工具**，其路由配置与「域语义」是两类东西，
#   混在域档案里会让"换工具配置"变成"改域档案"。

ima:
  kind: skill                     # ★ 是 skill，**不是 MCP**
  skill_dir_candidates:
    - "~/.workbuddy/skills/腾讯ima"
    - "~/.workbuddy/skills/ima-skills"
  api:
    base_url: "https://ima.qq.com"
    base_path: "/openapi/wiki/v1"
    method: POST
    auth_header:
      client_id: "ima-openapi-clientid"
      api_key: "ima-openapi-apikey"
  credentials_env: ["IMA_OPENAPI_CLIENTID", "IMA_OPENAPI_APIKEY"]
  credentials_note: "真值**只从环境变量读**，严禁写进包内任何文件；未设置 = 通道降级"
  endpoints:
    search_knowledge:
      path: "/search_knowledge"
      required: ["query", "cursor", "knowledge_base_id"]
      pagination: "next_cursor"
    search_knowledge_base:
      path: "/search_knowledge_base"
      required: ["query", "cursor", "limit"]
      note: "按库名反查 knowledge_base_id 的正路"
    get_addable_knowledge_base_list:
      path: "/get_addable_knowledge_base_list"
      required: ["cursor"]
      note: "列出当前用户有权限的库"
    get_knowledge_list:
      path: "/get_knowledge_list"
      required: ["cursor", "limit", "knowledge_base_id"]
  # ★ shareId **不是** API 可用标识——全部接口只收 knowledge_base_id（数字）。
  #   shareId 是**人工导航链接**（浏览器打开、核对库名与内容），不可填入 knowledge_base_id。
  share_id_note: "shareId 仅供人工导航/备查，**不可**填入 knowledge_base_id"
  # 库选择纪律（沿用原 domain-profiles.yaml#knowledge_bases_discipline）
  selection_discipline:
    - "每次任务只选 1–3 个最相关库；跨物种主题最多 3 库（库选错比查询串写得糙影响更大）"
    - "查询串须能读出「物种 + 病原或主题 + 部位或病变 +（如适用）限定词」四个维度，不必写成布尔式"
    - "每次任务开始先做工具探针（ima 可用性），探针结果记入 task_state.json，不得重复探测"
  # 无凭据/不可达时的降级路径
  fallback:
    when: "凭据缺失或通道不可达"
    to: "联网现查机构权威源（firecrawl_scrape / fetch_http）+ 包内域档案的机构端点"
    disclose: true          # ★ 降级必须声明（不得静默当同等能力）

# ── 知识库路由（7 库，从 domain-profiles.yaml 迁入）────────────────
# owner_scope：仅该域专业可用（管家节点裁决 #4：教学标准与知识库均仅动物医学专业）
# replaceable：用户可灵活更换 → 探针据此产出「主动提醒更换」
knowledge_bases:
  # ⚠ id 必须是 OpenAPI 的 ima_kb_XXXXXXXX 格式（2026-11-01 B9 实测：
  #   旧数字 ID 为 MCP 侧格式，OpenAPI 检索报 220004 invalid；
  #   真值来自 get_addable_knowledge_base_list，逐库检索验证 code:0）
  - id: "ima_kb_KulSqcqD"
    name: "《禽病》Avian Disease（主力库）"
    share_url: "https://ima.qq.com/wiki/?shareId=7ccf467e59453f5e7a7a2179219edc742a1bf253e1599bbacc5fd897d1fbe5d6"
    when: "所有禽类疾病主题"
    owner_scope: "animal-medicine"
    is_user_default: true
    replaceable: true
    update_policy: "持续更新"
  - id: "ima_kb_r8Phd7W3"
    name: "《猪病》"
    when: "猪病主题"
    owner_scope: "animal-medicine"
    replaceable: true
  - id: "ima_kb_e3TUqbxr"
    name: "《牛羊病》"
    when: "反刍动物疾病主题"
    owner_scope: "animal-medicine"
    replaceable: true
  - id: "ima_kb_FReOUX2i"
    name: "《伴侣动物疾病》"
    when: "犬猫等宠物疾病主题"
    owner_scope: "animal-medicine"
    replaceable: true
  - id: "ima_kb_Y0XyG9El"
    name: "病毒学-免疫学-细胞学"
    when: "机制类、免疫类、疫苗类内容"
    owner_scope: "animal-medicine"
    replaceable: true
  - id: "ima_kb_rxU8IsHJ"
    name: "流感"
    when: "流感病毒深入专题"
    owner_scope: "animal-medicine"
    replaceable: true
  - id: "ima_kb_sMvYcfkL"
    name: "动物疫病诊断技术（WOAH/FAO/WHO）"
    when: "诊断标准、采样送检、国际规范"
    owner_scope: "animal-medicine"
    replaceable: true

# ── 无账号内知识库的域：必须**主动提醒**换库，不得静默回落 ──────
domains_without_knowledge_bases:
  - id: computing
    fallback: "现查官方文档"
    reminder: "当前配置的知识库属**动物医学专业**，用于编程主题时请更换/更新为你所在专业的知识库"
  - id: business-training
    fallback: "现查制度原文与官方指引"
    reminder: "当前配置的知识库属**动物医学专业**，用于企业内训主题时请更换/更新为你所在专业的知识库"

# ═══════════════════════════════════════════════════════════════
# ③ 教学标准（维度 10）
# ═══════════════════════════════════════════════════════════════
# 管家节点裁决 #4：教育部《动物医学专业教学标准》**进包**，但**仅为动物医学专业**使用；
#   其他专业/领域使用时**要提醒用户更换/更新**；同时保持「只记标尺来源 + 现查原文」口径。
# ⇒ 落地形态：references/standards/animal-medicine-teaching-standard.md 是**结构化摘要**
#   （非全文转录）；需要精确条款时**现查 source_url**。
standards:
  - id: animal-medicine-teaching-standard-zk
    title: "动物医学专业教学标准（高等职业教育专科）"
    owner_scope: "animal-medicine"        # ★ 仅动物医学专业
    replaceable: true                     # 其他专业须提醒更换
    source_url: "https://www.moe.gov.cn/s78/A07/zcs_ztzl/2017_zt06/17zt06_bznr/bznr_zyjyzyjxbz/gdzyjy_zk/zk_nlmydl/nlmydl_xmyl/202502/P020250207521200573443.pdf"
    source_org: "教育部政府门户网站 moe.gov.cn"
    published: "2025-02"
    professional_code: "410301"
    summary_ref: "references/standards/animal-medicine-teaching-standard.md"
    verify:
      method: "sha256"
      reachability_verified: false
      note: |
        ⚠ v3.28.2 实测：本环境 curl/WebFetch 直取该 URL 返回 **404 / 「页面不存在!」**。
        该现象与本科版链接**相同**（见下一条），无法据此判定链接失效——
        可能是站点对非浏览器 UA 的拦截，也可能链接已变更。
        ⇒ 引用前**必须人工浏览器核验**；未核验前不得声称"已核实可达"。
        远端 sha256 基准值亦未登记（同前）。
    undergraduate_note: "**本科版已收录**（v3.28.2 B7 收录 / 3.28.3 批次 B11 直链失效处置）——见下一条 animal-medicine-teaching-standard-bk；原 PDF 直链已 404 移除，改用官方发布页 + 第三方全文页两个替代源（均已核验可达）"
    disclaimer: "本摘要**不替代原文**；需要精确条款时以现查 source_url 为准"
  # ── 本科版（职业本科）· v3.28.2 B7 收录 / 3.28.3 批次 B11 直链失效处置 ───────
  # 来历（L5 线索闭环）：原 undergraduate_note 长期写「本科版直链未核实」。
  # v3.28.2 检索确认该标准存在，收录了当时的 PDF 直链（三处未核验状态）。
  # B11 批次（3.28.3 时点，2026-11-01）人工核验结论：**该 PDF 直链已失效**——http 直取 404（「页面不存在」）、
  #   https 302→http→404，即教育部服务器端明确 404（非 UA/网络拦截）；
  #   搜索引擎仍缓存其正文（含专业代码 210301、修业四年、「禽病防治技术」等 9 门核心课程），
  #   证明该标准真实存在、直链确已被移除或改路径。
  # 处置（用户裁定）：source_url 撤下失效直链，改为**两个已核验可达的替代源**：
  #   ① 官方发布页（权威出处）：moe.gov.cn 758 项标准新闻，HTTP 302 可达
  #   ② 第三方全文页（内容副本）：lt.mentorsc.com/article/581，HTTP 200 可达，
  #      含 210301 完整标准正文（培养目标/课程设置/教学要求）
  #   两源已导入 IMA《禽病》知识库（weburl 型，2026-11-01，用户执行侧闭环）。
  - id: "animal-medicine-teaching-standard-bk"
    title: "动物医学专业教学标准（高等职业教育本科）"
    owner_scope: "animal-medicine"
    replaceable: true
    source_url: "https://www.moe.gov.cn/jyb_xwfb/gzdt_gzdt/s5987/202502/t20250211_1178746.html"
