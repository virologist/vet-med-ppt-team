# visual-rules.yaml — 教学课件视觉红线参数（单一数据源）
# ══════════════════════════════════════════════════════════
# v1.9.0 新增：屠明熙（视觉规则引擎）维护的本文件是全团队唯一的视觉红线数据源。
# 消费方：① scripts/verify_deck.py（机械裁判）② 批量修改脚本（前置断言）
#         ③ 屠明熙 MD（人读版规则，与此文件同源）
# 改红线只改这里，脚本与 MD 均以本文件为准（防 R18 式两张皮事故）。
# 维护纪律：任何修改须在屠明熙 MD 的变更记录中注明理由+日期。

# ── 字号红线（屠明熙 v1.5.0 底线值，机器校验）──
font:
  body_min_pt: 12.0        # 正文最小字号（R18 事故教训：批量缩字号不得低于此值）
  note_min_pt: 9.0         # 图注/来源最小字号
  title_min_pt: 28.0       # 主标题最小字号

# ── 单页容量红线 ──
density:
  max_colors_per_slide: 5  # 单页最多颜色数（超出=配色混乱）
  max_chars_per_slide: 400 # 单页最多字符（全页口径，超出=文字墙，必须拆页）
  # v3.5.0 新增（经验来源：单页主框 250-430 字压到 ≤150 字耗了六轮返工；
  #   根因是设计期只有"全页 400 字"上限，主框密度无约束 → 密到无可救药才被迫瘦身。
  #   设计期就设主框上限，一轮达标）
  max_body_chars_per_slide: 150  # 单页主框正文字符上限（标题/图注/页脚不计入）
  # 降密执行顺序：**低级能解决不升级**；调字号是最后手段且不得低于 font.body_min_pt
  shrink_order: ["删冗余", "转结构化（表格/图示/流程）", "拆页或移入备注", "调字号（≥body_min_pt）"]

# ── 主题色令牌（v3.5.0 新增）──
# 经验来源：AI 新增页自创配色 → 与源课件视觉基因割裂，需一轮专门"视觉一致性打磨"补救。
# 原则：**沿用源课件已声明的色令牌，禁止自创**。本段只定义槽位结构，不绑定具体色值——
#   实际取值优先读工作区 <workspace>/.workbuddy/theme.yaml，其次读源课件主题指纹，
#   二者皆无时由屠明熙抽取登记后再施工。
theme:
  enforce_source_theme: true     # 新增/改造页沿用源课件主题；未登记主题前不得批量新增页
  max_new_colors_per_slide: 0    # 新增元素允许引入的新色数量（0=不得自创，与上一行互斥校验）
  token_slots: ["primary", "secondary", "alert", "neutral_text", "neutral_bg"]  # 令牌槽位（值不在此定义）

# ── 几何红线 ──
geometry:
  overlap_ratio: 0.15      # 文本框重叠面积占较小框比例阈值（超出=违规）
  offcanvas_tolerance_in: 0.25  # 文字越界容差（装饰性出血不计）

# ── 课时-页数标准（苏学法课时表同源）──
hours_page_range:
  1: [18, 28]              # 1 课时 45min
  1.5: [35, 50]            # 1 小时教学单元 60min（v1.6.0）
  2: [36, 52]              # 2 课时 90min
  3: [55, 78]              # 3 课时 135min
  4: [72, 104]             # 4 课时 180min

# ── 图注五要素（v1.6.0，人读检查项，机器不判）──
caption_five_elements:
  - 对照关系        # 如"左健康右病变"
  - 物种日龄病程    # 如"25日龄白羽肉鸡，病程3天"
  - 来源与许可      # 期刊+年份+PMCID+许可
  - 教学意义        # 一句话
  - 示意声明        # 仅示意图需要："教学示意，不得替代真实诊断图像"
# v3.6.0 补充判据（迭代六原则⑥·素材判读红线）：
#   ① 图注断言只能来自对图像本体的逐张判读，判读不出的特征不得写（低清图降级"情境图"并明示受限）
#   ② 来源缺失时写"原始课件素材"或如实标注媒体水印，禁猜测期刊/机构
#   ③ 要素缺项必须显式挂账（harness.yaml#delta_gate.caption_missing_element_policy），禁静默省略
#   ④ 推荐形态：图注含"看图任务"（先猜后揭晓），把配图变互动素材

# ══════════════════════════════════════════════════════════
# ── 分级门禁（v2.0.0 新增）──
# 依据：09-26 首战实测 11 份课件 1281 条红灯、0 份全绿——"全清"物理不可达，
#       不可达的门禁必然被绕过（stage5 四项 deviations 上升用户拍板实证）。
# 消费方：verify_deck.py 退出码 0=通过 1=P0阻断 2=P1阻断 3=P2阻断 4=运行错误
gate:
  p2_note_coverage: 0.80   # 备注覆盖率低于此值 = P2 阻断（仅交付级 level=all）
  write_gate_level: "P0"   # 郅作基写回门禁默认级别：P0=0 即准写回
  deliver_gate_level: "all" # 交付门禁级别：P0=0 且 P1=0 且 P2 覆盖率达标

# ── 问题分级映射（v2.0.0）──
severity:
  P0: [字号过小, 文字越界, 配色混乱, 空白页, 课时不达标, 缺目录页, 缺题页]   # 硬阻断
  P1: [元素重叠, 文字墙]                                                    # 当次必清，可带计划写回
  P2: [缺备注]                                                              # 覆盖率指标

# ── 叠加层注入规范（v2.0.0 新增，防"A轨加框制造红灯"——09-26 实测 486 处重叠 + 8pt 钩子教训）──
# 消费方：A轨批量注入脚本前置断言 + 屠明熙抽样复核 + 郅作基门禁
overlay_injection:
  min_font_pt: 12.0          # 注入文本（钩子/任务卡/页脚）不得低于正文红线——试做12pt批量8pt的两张皮事故禁止复发
  require_empty_slot: true   # 注入前必须检测空位；无空位 → 拆页，禁止硬叠
  max_overlap_ratio: 0.15    # 注入框与既有文本框重叠超此值 = 注入失败
  sample_review_ratio: 0.20  # 屠明熙抽样复核比例（下限20%，几何红灯页100%复查）
