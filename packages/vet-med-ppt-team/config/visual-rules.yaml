# visual-rules.yaml — 教学课件视觉红线参数（单一数据源）
# ══════════════════════════════════════════════════════════
# v1.9.0 新增：屠明熙（视觉规则引擎）维护的本文件是全团队唯一的视觉红线数据源。
# 消费方：① scripts/verify_deck.py（机械裁判）② 批量修改脚本（前置断言）
#         ③ 屠明熙 MD（人读版规则，与此文件同源）
# 改红线只改这里，脚本与 MD 均以本文件为准（防 R18 式两张皮事故）。
# 维护纪律：任何修改须在屠明熙 MD 的变更记录中注明理由+日期。

# ── 字号红线（屠明熙 v1.5.0 底线值，机器校验）──
font:
  body_min_pt: 12.0        # 正文最小字号（R18 事故教训：批量缩字号不得低于此值）
  note_min_pt: 9.0         # 图注/来源最小字号
  title_min_pt: 28.0       # 主标题最小字号

# ── 单页容量红线 ──
density:
  max_colors_per_slide: 5  # 单页最多颜色数（超出=配色混乱）
  max_chars_per_slide: 400 # 单页最多字符（全页口径，超出=文字墙，必须拆页）
  # v3.5.0 新增（经验来源：单页主框 250-430 字压到 ≤150 字耗了六轮返工；
  #   根因是设计期只有"全页 400 字"上限，主框密度无约束 → 密到无可救药才被迫瘦身。
  #   设计期就设主框上限，一轮达标）
  # v3.16.0：**本项自 v3.5.0 落配以来一直无代码读取者（死配置），本版首次 wiring**——
  #   现由 verify_deck.py 的「主框密度」检查消费，超出发 `主框密度超标`（P1，见 severity.P1）。
  #   计入口径（确定性规则，非语义猜测）：排除标题占位符、图注/来源、页脚页码框后的文本框架字符数合计。
  #   ⚠ 与人读文档的关系：course-profile-defaults.md §2 硬约束 1 的「≤120 字」是**设计期自检目标**，
  #     不是机器阈值；机器阈值唯一取本键（150）。两个数字并存已在人读文档中显式标注。
  max_body_chars_per_slide: 150  # 单页主框正文字符上限（标题/图注/页脚不计入）
  # 降密执行顺序：**低级能解决不升级**；调字号是最后手段且不得低于 font.body_min_pt
  shrink_order: ["删冗余", "转结构化（表格/图示/流程）", "拆页或移入备注", "调字号（≥body_min_pt）"]

# ── 主题色令牌（v3.5.0 新增）──
# 经验来源：AI 新增页自创配色 → 与源课件视觉基因割裂，需一轮专门"视觉一致性打磨"补救。
# 原则：**沿用源课件已声明的色令牌，禁止自创**。本段只定义槽位结构，不绑定具体色值——
#   实际取值优先读工作区 <workspace>/.workbuddy/theme.yaml，其次读源课件主题指纹，
#   二者皆无时由屠明熙抽取登记后再施工。
theme:
  enforce_source_theme: true     # 新增/改造页沿用源课件主题；未登记主题前不得批量新增页
  max_new_colors_per_slide: 0    # 新增元素允许引入的新色数量（0=不得自创，与上一行互斥校验）
  token_slots: ["primary", "secondary", "alert", "neutral_text", "neutral_bg"]  # 令牌槽位（值不在此定义）

# ── 几何红线 ──
geometry:
  overlap_ratio: 0.15      # 文本框重叠面积占较小框比例阈值（超出=违规）
  offcanvas_tolerance_in: 0.25  # 文字越界容差（装饰性出血不计）

# ── 课时-页数标准（苏学法课时表同源）──
# ══════════════════════════════════════════════════════════
# ⚠️ v3.16.0：**这里有两张页数表，语义不同，不可互换**。此前长期只用一张表判全部场景，
#    与 references/course-profile-defaults.md §2（单次 PPT 口径）**完全不重叠**，
#    导致按 §2 制作的课件被机器判「课时不达标」P0——是典型的"声明层与执行层两张皮"。
#    用户裁决：**不改任何原值，新增口径参数并存**，由调用方显式切换（默认 = course）。
#
#  | 键名                        | 语义（课时对象的口径）              | 数值来源                                  |
#  |---|---|---|
#  | `hours_page_range`          | **整套课程课件**：一门课全部课时的课件合计页数 | 本文件（苏学法课时表，v1.6.0 起）          |
#  | `hours_page_range_single_ppt` | **单次 PPT**：一次授课（1–4 课时 × 45min）交付的单份 PPT | `references/course-profile-defaults.md#2` |
#
#  消费方式：`python3 scripts/verify_deck.py <deck> --hours N --caliber course|single-ppt`
#  （`verify_deck.py` 的 `_load_threshold()` 同时加载两张表，按 caliber 选一张。）
#  **默认 caliber 见 `page_caliber_default`，不会因使用场景静默改变。**
# ══════════════════════════════════════════════════════════
hours_page_range:                    # 口径 A：整套课程课件（历史默认值，不得改动——改了历史复验结论就变了）
  1: [18, 28]              # 1 课时 45min
  1.5: [35, 50]            # 1 小时教学单元 60min（v1.6.0）
  2: [36, 52]              # 2 课时 90min
  3: [55, 78]              # 3 课时 135min
  4: [72, 104]             # 4 课时 180min

# 口径 B：单次 PPT（v3.16.0 新增；数值同源 course-profile-defaults.md#2 的建议页数区间）
# 该表**不构成** <1.5 课时档位（§2 无 1.5 课时行）。
# ⚠️ 缺档行为（v3.16.0 修正，勿再照旧理解）：`verify_deck` **不再**回退 (0,9999) 静默放行，
#   而是显式报「口径 <X> 未定义 <N> 课时的页数标准，课时匹配未执行（非通过）」，
#   `hours_ok=false` 表示**未判定**（既非达标也非不达标），计入 P3 明示、**不阻断写回**，
#   并同时出现在 stderr / stats.hours_standard_missing / --json 报告里。
#   即：**缺档不等于通过，但也不伪装成硬阻断**——避免"护栏没跑"被读成"达标了"。
#   要补 1.5 课时档请先取得依据（教务处课时表），**不得为凑档自行推导区间**；
#   确需按单次 PPT 口径交付 1.5 课时，见 references/batch-surgery-sop.md#§8 降级签字流程。
hours_page_range_single_ppt:
  1: [12, 18]              # 1 课时 45min
  2: [22, 32]              # 2 课时 90min
  3: [32, 45]              # 3 课时 135min
  4: [42, 58]              # 4 课时 180min

# 默认页数口径（v3.16.0）：`course`=口径A / `single-ppt`=口径B。
# 消费方：verify_deck.py 的 `--caliber` 默认值、缩主时的默认行为。
# ⚠️ **改这里等于改全部历史课件的复验结论**——必须走用户裁决，不得为使某份课件变绿而切换。
page_caliber_default: "course"

# ── 图注要素（v3.18.0 统一为「通用骨架 + 域扩展」）────────────────
# 缺陷（2026-10-25 从零诊断 G4 实测）：图注要素**四套定义并存**——
#   ① 本段 caption_five_elements（5 项·域口径：对照关系/物种日龄病程/来源与许可/教学意义/示意声明）
#   ② references/seven-dimension-rubric.md:107（5 项·域无关：图题/对象/时间/口径/来源）
#   ③ agents/dvm-content-expert.md:262 + 各域 image_channel.caption_elements（3 项·域专属）
#   ④ computing 域的 caption_elements（3 项·又不同）
# 而 rubric:106-110 **自认冲突并声明「本文件不替 config 做决定」**——即明知冲突而不调和。
#   ⇒ 后果：图注判据随域而变且无统一底座，与"通用诊断工作流"目标直接冲突。
#
# v3.18.0 处置：**通用骨架（域无关，任何域都必须有）+ 域扩展（域专属补充）**
#   · caption_base_elements（**唯一源**）——通用骨架，3 项，机器与人读口径一致；
#   · caption_five_elements —— **保留为历史键**（向后兼容，下游若有引用不报错），
#     但已 deprecated：实际判定取 caption_base_elements；
#   · 域扩展 —— 放在各域档案 image_channel.caption_extra_elements，
#     **不得与骨架重复**（重复由 test_arch_drift.py 漂移守卫阻断）。
caption_base_elements:
  - 对象            # 图上是什么（主体 + 关键结构/特征）
  - 来源与许可      # 期刊/机构 + 年份 + 标识（PMCID/DOI/标准号）+ 许可
  - 教学意义        # 一句话说明为什么放这张图、要看什么
# ⚠ 域扩展（各域专属补充项）见 config/domain-profiles.yaml
#   #domains[].image_channel.caption_extra_elements —— 例：animal-medicine 增
#   「实验条件 / 观察部位 / 临床意义」；computing 增「运行环境与版本 / 图示或代码要点」。
caption_base_elements_note: "通用骨架（域无关·唯一源）；域扩展见域档案 image_channel.caption_extra_elements"

# ── 图注五要素（v1.6.0；**已 deprecated** —— 保留仅为向后兼容）──
# ⚠ v3.18.0 起**实际判定读 caption_base_elements**（通用骨架）。
#   本键是 v1.6.0 的**域口径**历史清单（对照关系/物种日龄病程/…），
#   与 rubric 的域无关清单不一致——这正是 G4 缺陷的来源，现已由骨架+域扩展结构取代。
#   保留而不删除：下游（teaching-ppt-studio skill 等）若有引用不至于崩。
caption_five_elements:
  - 对照关系        # 如"左健康右病变"（域扩展项，现归各域 caption_extra_elements）
  - 物种日龄病程    # 如"25日龄白羽肉鸡，病程3天"（同上）
  - 来源与许可      # 期刊+年份+PMCID+许可（**已并入骨架**，勿重复计入域扩展）
  - 教学意义        # 一句话（**已并入骨架**，勿重复计入域扩展）
  - 示意声明        # 仅示意图需要："教学示意，不得替代真实诊断图像"
# v3.6.0 补充判据（迭代六原则⑥·素材判读红线）：
#   ① 图注断言只能来自对图像本体的逐张判读，判读不出的特征不得写（低清图降级"情境图"并明示受限）
#   ② 来源缺失时写"原始课件素材"或如实标注媒体水印，禁猜测期刊/机构
#   ③ 要素缺项必须显式挂账（harness.yaml#delta_gate.caption_missing_element_policy），禁静默省略
#   ④ 推荐形态：图注含"看图任务"（先猜后揭晓），把配图变互动素材

# ══════════════════════════════════════════════════════════
# ── 分级门禁（v2.0.0 新增）──
# 依据：09-26 首战实测 11 份课件 1281 条红灯、0 份全绿——"全清"物理不可达，
#       不可达的门禁必然被绕过（stage5 四项 deviations 上升用户拍板实证）。
# 消费方：verify_deck.py 退出码 0=通过 1=P0阻断 2=P1阻断 3=P2阻断 4=运行错误
gate:
  p2_note_coverage: 0.80   # 备注覆盖率低于此值 = P2 阻断（仅交付级 level=all）
  write_gate_level: "P0"   # 郅作基写回门禁默认级别：P0=0 即准写回
  deliver_gate_level: "all" # 交付门禁级别：P0=0 且 P1=0 且 P2 覆盖率达标

# ── 问题分级映射（v2.0.0）──
severity:
  P0: [字号过小, 文字越界, 配色混乱, 空白页, 课时不达标, 缺目录页, 缺题页]   # 硬阻断
  # v3.16.0：新增「主框密度超标」（消费 density.max_body_chars_per_slide）。
  #   **必须显式登记**：verify_deck 对未知问题类型的后续处理是「不落 P0」（见代码 _TYPE_LEVEL），
  #   未登记的新类型会静默掉出所有分级统计 —— 登记在 yaml = 让分级可见且可审计。
  P1: [元素重叠, 文字墙, 主框密度超标]                                     # 当次必清，可带计划写回
  P2: [缺备注]                                                              # 覆盖率指标

# ── 建议级检查（rubric，v3.16.0 新增）──
# ══════════════════════════════════════════════════════════
# 背景：course-profile-defaults.md §4.2 的 V1（版式统一=标题位置一致性）与
# V5（图文比例=图片面积占比 + 纯文字页连续上限）长期标 `[机]` 但**无任何代码消费**——
# 承诺了机器校验，实际只有人眼看。
#
# **为什么默认关闭（enabled: false）而不是直接上线**：
#   这两项缺**基线标定**——既没有"模板固有版式"的基线，也没有历史课件的分布数据，
#   容差/区间取值（0.25in / 20–50% / 连续 3 张）尚未在本课程资产上验证过。
#   默认开启会产出**无法校准的假阳性**；而本项目纪律是「**假阳性必须为零，否则门禁会被绕过**」
#   ——两者冲突时，选择"先不出数"，而不是"先出数再解释"。
#
# 故落地为 **rubric（建议级）**：
#   • 结果进 `verify()` 返回值 `result["rubric"]`（每条含 check_id / slide / detail）；
#   • **不计入 p0/p1/p2**，不影响退出码，不阻断任何门禁；
#   • 开关打开后条目必须能在 `--json` 报告中看到（验收可查）。
# 标定流程：选 3–5 份历史全绿课件 → 打开开关跑一遍 → 统计假阳性分布 → 校准取值 → 再申请转正 P1。
checks:
  title_position_consistency:        # V1：同层级页标题位置一致性（left/top/width 取众数后偏离容差）
    enabled: false
    tolerance_in: 0.25               # 允许偏离众数的最大值（英寸，三边分别比较）
  image_area_ratio:                  # V5：单页图片面积占比 + 纯文字页连续上限
    enabled: false
    min: 0.20                        # 图片面积 / 页面积 下限（低于=图文偏文字）
    max: 0.50                        # 上限（高于=图文偏图）
    max_consecutive_textonly: 3      # 纯文字页（无图片）最多连续 N 张

# ── 叠加层注入规范（v2.0.0 新增，防"A轨加框制造红灯"——09-26 实测 486 处重叠 + 8pt 钩子教训）──
# 消费方：A轨批量注入脚本前置断言 + 屠明熙抽样复核 + 郅作基门禁
overlay_injection:
  min_font_pt: 12.0          # 注入文本（钩子/任务卡/页脚）不得低于正文红线——试做12pt批量8pt的两张皮事故禁止复发
  require_empty_slot: true   # 注入前必须检测空位；无空位 → 拆页，禁止硬叠
  max_overlap_ratio: 0.15    # 注入框与既有文本框重叠超此值 = 注入失败
  sample_review_ratio: 0.20  # 屠明熙抽样复核比例（下限20%，几何红灯页100%复查）
