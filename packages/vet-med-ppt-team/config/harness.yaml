# harness.yaml — 编排层（状态机 / 路由 / 预算 / 白名单 / 降级）唯一数据源
# ══════════════════════════════════════════════════════════
# v2.2.0 新增。缘由（2026-09-29 基线实测）：
#   编排全靠主理人自觉遵守 Markdown 纪律 → 成员不可调度即整链阻断（苏学法 ×3）、
#   静默降级无人察觉（严真奥被登记为 general-purpose）、预算与耗时无任何计量。
# 原则：**方法论下沉为代码**。本文件是编排事实的唯一源，scripts/harness.py 消费它，
# MD 里只留"人读说明 + 指向本文件"，禁止 MD 与脚本各写一套。
#
# 消费方：scripts/harness.py（preflight / route / state / budget / trace / gate）

version: "3.10.0"

# ── 显式状态机：阶段号 → 合法成员、门禁、后继 ──────────────────
# v3.0.0：六阶段 → **四道闸**（第二轮诊断方案 C）。
# v3.3.0：扩为 5 闸（追加 stage 4 = 闸 4.5 案例三源核验），双轨期 0-4 合法。
# 只认整数 0-4；任何其它取值（如 "M5A2"、"stage_6"）一律判非法。
stages:
  0: {name: "闸1 任务冻结", members: [], gate: "user_confirm", next: 1}
  1: {name: "闸2 设计（蓝图∥证据）", members: ["pedagogy-architect", "dvm-content-expert"], gate: "user_confirm", next: 2}
  2: {name: "闸3 成稿（页表∥版式）", members: ["pedagogy-architect", "visual-slide-designer"], gate: "script_check", next: 3}
  3: {name: "闸4 交付（门禁+独立验证）", members: ["verifier"], gate: "gate_script+verifier", next: 4}
  4: {name: "闸4.5 案例三源核验（v3.3.0）", members: ["dvm-content-expert", "verifier"], gate: "three_source_check", next: null}

# ── 成员注册表：职责、工具白名单、降级通道 ────────────────────
# 工具白名单说明：WorkBuddy 专家包**不支持** agent frontmatter 的 tools 字段
# （2026-09-30 commit cd6fc41 实测确认，属平台铁律）。
# 因此最小权限靠「人设装配（assemble_spawn_prompt.py）+ 任务包约束」实现，
# 本表是主理人编排时的意图声明，供 preflight 与人工核对。
members:
  dvm-content-expert:
    duty: "证据核验与分级（唯一内容权威）"
    tools_whitelist: ["Read", "Grep", "Glob", "WebSearch", "WebFetch", "ToolSearch", "DeferExecuteTool"]
    writes_allowed: false
    spawn: "常驻（L1+ 必调）"
    fallback: "general-purpose+persona"
  pedagogy-architect:
    duty: "教学蓝图与页表教学列（含 speaker_note / page_role）"
    tools_whitelist: ["Read", "Write"]
    writes_allowed: true
    spawn: "常驻（L1+ 必调）"
    fallback: "general-purpose+persona"
  visual-slide-designer:
    duty: "高价值页人工设计 + 抽样复核裁决（红线参数与外科判据已下沉 yaml/SOP/脚本）"
    tools_whitelist: ["Read", "Write"]
    writes_allowed: true
    spawn: "常驻（L2+）；L1 按需"
    fallback: "general-purpose+persona"
  ppt-producer:
    duty: "门禁与台账的**职责保留**；v3.0.0 起不再常驻 spawn，改按需调用"
    tools_whitelist: ["Read", "Bash", "Write"]
    writes_allowed: true
    spawn: "按需（L3 批量 / 门禁异常 / 台账重建时）"
    fallback: "script_pipeline"   # 门禁本质是脚本，成员不可用时由 harness gate 直跑
  verifier:
    duty: "独立验证（V 层）：终检独立复算、裁判口径第二签、挂账审判"
    tools_whitelist: ["Read", "Bash", "Grep", "Glob"]
    writes_allowed: true          # 只允许写验证报告，不得改课件
    spawn: "按需（闸4 必调 + 口径变更时）"
    fallback: "script_pipeline"   # 无成员时退化为 harness gate + verify-artifact 组合

# ── 复杂度分级 → spawn 计划（v3.0.0：默认计划不含 ppt-producer，含 verifier）──
routing:
  L0: {team_create: false, spawn: [],                                    confirm_gates: 1}
  L1: {team_create: true,  spawn: ["pedagogy-architect|dvm-content-expert（按需1-2名）"], confirm_gates: 2}
  L2: {team_create: true,  spawn: ["pedagogy-architect", "dvm-content-expert", "visual-slide-designer", "verifier"], confirm_gates: 2}
  L3: {team_create: true,  spawn: ["pedagogy-architect", "dvm-content-expert", "visual-slide-designer", "verifier", "ppt-producer（批量/台账）"], confirm_gates: 2, red_team: true}

# ── 降级协议（v2.2.0 新增：成员不可调度时不再整链阻断）──────────
fallback:
  max_spawn_attempts: 2            # 同一成员最多尝试 2 次（原实测 3 次全失败且无止损）
  on_unavailable: "degrade"        # degrade | block —— 默认不再 block
  degrade_modes:
    general-purpose+persona: "spawn 通用子代理，并在任务包开头注入该成员 MD 全文（人格+红线）"
    script_pipeline: "改由 scripts/ 下确定性脚本直接执行（仅适用 ppt-producer 门禁类职责）"
  require_disclosure: true         # 降级必须在交付物与 trace 中显式声明，禁止静默

# ── 预算护栏（任务级，宿主 maxTurns 之外的真正约束）────────────
budgets:
  max_member_spawns: 8             # 单任务累计成员调度次数
  max_spawn_attempts_per_member: 2
  max_react_rounds_per_gap: 3      # 严真奥单条证据缺口
  max_react_rounds_total: 15
  max_rework_rounds_per_stage: 2
  max_stage_minutes: 20            # 单阶段挂钟上限（超时 → 上报，不等死）
  max_artifact_bytes: 60000        # 单个成员产物字节上限；超限强制"只传路径+摘要"
  # v3.3.0：闸4.5 三源核验预算
  three_source_sample_rate: 0.1    # 抽检 10% cases
  three_source_pass_threshold: 0.8 # 通过率 ≥80% 达标（domain_config.yaml#three_source_check.pass_threshold）

# ── 快照策略（v3.3.1 治理批新增：痛点①备份膨胀的对症段）────────
# 缘由（2026-10-14 诊断实测）：snapshot.py 自 Batch 2 就绪但 .snapshots/ 从未初始化，
#   AI 迭代产物以 _v2_v3 旁路文件堆积（消毒剂使用规范-优化版E_v2_v3.pptx 实证），
#   课程工作区 14G 中约半数为可再生/可归档内容。
# 原则：**唯一活跃版 + 原始件双轨**——AI 修改课件原地写回（禁旁路新文件），
#   写回前自动 snap；原始课件（非 AI 产物）永不覆盖，只读引用。
snapshot:
  enabled: true                    # 总开关（false 时 harness 跳过自动 snap）
  max_mb: 6000                     # 快照库容量上限（LRU 淘汰，milestone 永久保留不计入）
                                   # v3.4.3 C3（裁决3-B）：500→6000——5.5G 实际水位是 v3.4.2 P2-3
                                   # 的"基线永久"有意决策（见下注），非意外膨胀；上限对齐设计
                                   # 以消除体检误报，未删任何快照。未来磁盘受限可按下行注释降级。
  keep: 3                          # 每课件保留 K 份（里程碑点永久除外）
  auto_snap_on_writeback: true     # ppt-producer 写回前自动打点（trigger=auto_pre_writeback）
  milestone_tags_permanent: true   # milestone 类快照不参与 LRU
  first_snap_targets: "194"        # 启用当日对全部存量课件打首版快照（baseline-v3.3.1）
  # v3.4.2 P2-3 备注：当前 .snapshots 5.6G 超出 500M 上限，但所有快照均标 baseline-v3.4.2
  #   milestone tag 永久保留。如下游工作区磁盘受限，可手动编辑此字段 max_mb 调高或
  #   关闭 milestone_tags_permanent 让 GC 生效——本工作区选择"基线永久"以保首次收编可回滚。

# ── 上下文压缩（隔离：主理人不吃全文）─────────────────────────
context:
  handoff_mode: "path_only"        # path_only | summary | full
  summary_max_chars: 800           # 成员回传摘要上限；全文只落盘、不进对话
  state_max_bytes: 32768           # task_state.json 体积上限，超限触发 compaction
  state_allowed_keys:              # 白名单外的键一律拒绝写入
    - task_id
    - workflow
    - current_stage
    - stage_history
    - user_confirmations_pending
    - tool_probe_results
    - budget
    - next_action
    - compaction

# ── 可观测性 ────────────────────────────────────────────────
observability:
  trace_file: ".workbuddy/harness_trace.jsonl"   # 追加式 JSONL，每事件一行
  trace_events: ["team_create", "preflight", "spawn", "spawn_failed", "degrade",
                 "member_return", "gate", "stage_enter", "stage_exit", "budget_exceeded", "error"]
  report_on_finish: true

# ── 增量门禁（v3.5.0：改造类任务的验收基准 = 自引入缺陷 0，不是绝对红灯 0）──
# 经验来源：一次多轮增补实战中，成品 P0=6 与改造前基线完全相等（自引入 0），但按绝对数口径
#   会被误判为"施工产出 6 条红线"；反之，用"存量也有"掩盖自引入同样不可接受。
delta_gate:
  baseline_required: true          # 改造/增补类任务施工前必记基线；基线缺失 = 报告不合格
  baseline_fields: ["p0", "p1", "p2", "pages_physical", "pages_visible", "md5"]
  block_on_new_defects: true       # 自引入 P0/P1 > 0 → 阻断；存量缺陷挂账不阻断
  report_format: "P0=6（基线 6，自引入 0）"   # 只报绝对数的报告视为不合格，退回复算
  miss_needs_human_review: true    # 机器 MISS 未经规范化复核不得计入缺陷、不得升 P0
  # v3.6.0（迭代五/六原则的机器背书段）：
  insert_spatial_audit: true       # 向既有页插入新元素前必须枚举目标区全部形状区间，重叠率 0% 才准插
  insert_font_at_creation: true    # 新元素文字规格创建时即达合规（正文≥12pt），禁"先插后调"两步走
  image_caption_requires_reading: true  # 图像类图注/讲稿必须先逐张判读图像本体；判读不出不得写
  caption_missing_element_policy: "explicit_todo"  # 图注要素缺项必须显式挂账，禁静默省略

# ── 双层 Loop 隔离（v3.8.0 增补 B）───────────────────────────
# 背景：Loop A（改专家团工程）与 Loop B（处理用户真实课件）此前共用
# task_state.json，授权边界模糊——易把"确认升级指令"误读为"授权处理课件"。
# 处置：两个 Loop 各自独立状态文件 + 独立授权域，互不触发。
loop_a:
  enabled: true                   # 总开关
  trigger: "管家节点下达的专家团升级/修复指令"
  state_file: "<包>/.workbuddy/loopA_state.json"
  scope:                          # 允许触碰的目录（白名单，越界即越权）
    - "<包>/scripts"
    - "<包>/config"
    - "<包>/references"
    - "<包>/agents"
  forbidden_paths:                # 绝对禁区：Loop A 任何行为不得触碰用户课件目录
    - "<工作区>/**/*.pptx"
    - "<工作区>/**/*.ppt"
    - "<工作区>/.workbuddy/artifacts"
  patch_discipline: "minimal"     # 只围绕已核验真实缺口做最小补丁
  confirm_before_each_batch: true # 每批修改前必须向管家节点确认
  regression_required: ["ensure_settings", "test_harness", "test_five_gates"]

loop_b:
  enabled: true
  trigger: "管家节点点名某份已有 PPT 要求优化/深化"
  state_file: "<工作区>/.workbuddy/loopB_state.json"
  coexist_with: "<工作区>/.workbuddy/task_state.json"   # 并存，不覆盖（五道闸状态机语义不变）
  single_writer: "team-lead"      # 单写者：成员不得直接写状态文件，回传由主理人汇编落盘
  original_readonly: true         # 原件只读；工作副本 <name>_wip/ 迭代；最终另交新版
  round_review:
    required: true                # 每轮必须停等用户确认（references/round-review-sop.md）
    silent_is_not_approval: true  # 沉默/超时/成员自评均不构成确认
    partial_accept_freezes_only_named: true  # 部分接受只冻结被点名条目
    rework_stays_in_round: true   # 返修仍属当前轮，不进位
    invalidation: "sha256"        # 内容文件哈希变化 → 该条目批准自动失效，须重审
  budgets:                        # 全部可调；达上限只暂停报告，禁止宣布通过
    max_rounds: 8
    max_items_per_round: 5        # v3.8.0 N3：每轮条目上限（小批是让用户真正读完的关键）
    retrieval_budget_per_round: 30
    no_progress_threshold: 2
    max_rework_per_item: 2
  termination: ["成功完成", "等待用户", "能力或证据阻塞", "达到预算但未完成", "用户取消"]
  # v3.10.0：用户已确认的接单默认（覆盖须在 intake 显式记录并置 confirmed）
  defaults:
    profile_ref: "references/course-profile-defaults.md"   # 受众四层 / 课时映射 / 范围 / 验收矩阵
    template_ref: "references/default-template-profile.md" # 默认模板指纹 5fa78154 + 三条硬约束
    delivery_ref: "references/delivery-spec.md"            # 交付三件套 schema
    audience: "职业本科（默认）；可切 基层兽医/一线技术人员、本科生、研究生"
    hours_per_session: "1-4 课时 × 45min"
    scope: "全部页面，逐页六查（标题层级/正文表述/图表/案例/思考题/小结）"
    default_template: "/Users/biodog/Library/CloudStorage/OneDrive-Personal/养禽与禽病防治/教材编写-刘/禽病防治技术PPT模板.pptx"
    template_fingerprint: "5fa78154"
    keep_original_layout: true    # 已有原稿版式的沿用原稿，不强制迁到默认模板
    geo_baseline_required: true   # 成品 lint 必配 --geo-baseline，否则 V7 无法判定

# ── 门禁退出码语义（主理人据此分流，不再一律"打回"）────────────
gate_exit_codes:
  0: "通过"
  1: "P0 硬阻断——禁止写回，先组织修复"
  2: "P1 阻断——可带修复计划写回，交付前清零"
  3: "P2 阻断——备注覆盖率未达标"
  4: "运行错误——脚本/文件问题，非课件质量；必须报 traceback 并走缺陷回流，不得当作红灯打回成员"
