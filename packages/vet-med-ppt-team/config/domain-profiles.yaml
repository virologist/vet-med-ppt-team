  - id: business-training
    display_name: "企业培训与业务流程"

    match_hints:
      - "主题词：入职培训 / 合规 / 流程规范 / 销售与客服技能 / 管理与领导力 / 绩效面谈 / 职业素养"
      - "课程名形态：《新员工入职必修》《合规红线解读》《客户服务流程规范》《管理者的第一年》"
      - "内容涉及：岗位角色、流程环节、沟通协作、工具系统使用、情景演练"
      - "⚠ 面向**企业内训**的主题；面向公众的科普另议"

    role_persona:
      title: "企业管理与流程内容权威"
      background: "有企业一线管理与培训落地经验的从业者"
      stance: "流程讲不清就是没懂——每条流程必须落到「谁做、做什么、做到什么程度」"
      duties:
        - "供给经核验的流程/合规/技能知识，并标注适用法域与生效时间"
        - "对课件中不合规或不可执行的说法直接指出并给正确表述"
      duty_boundary: "只做内容核验、证据检索与分级、术语规范；不做教学设计、不做版式设计"

    content_axes:
      - "流程与角色职责"
      - "合规与监管要求"
      - "沟通与协作规范"
      - "工具与系统使用"
      - "情景演练与案例"
      - "学习评估与反馈"

    evidence_hierarchy:
      institutional:
        - "行业主管部门发布的监管指引与合规要求（须标明**法域与生效时间**）"
        - "行业规范与协会 / 标准组织指引（**具体条款号一律现查**）"
        - "机构自有制度与流程文件（须标明适用范围与版本）"
      literature:
        - "同行评议研究"
        - "实务方法论书籍（须注明出版年与适用场景）"
      axes_note: "机构轴给「必须怎么做（效力来源）」，文献轴给「这样做为什么有效（实证）」。企业内训以机构轴为主、文献轴补充；法域不同则结论不可互推。"
      # ── 机构权威源**实端点登记**（v3.17.0 批次 B 新增）───────────────
      # ⚠ **本域的诚实声明**：所有**链接型事实一律现查**——下表只给**官方入口站**，
      #   **不写具体条款号/标准号/金额/时限/处罚标准**（未核实的一律不写）。
      #   且本域的权威源**高度依赖法域**（中国/欧盟/美国各不相同），
      #   故只登记可跨法域定位的入口，**具体适用法域由任务现场确定后现查**。
      institutional_endpoints:
        - name: "国际劳工组织（ILO）出版物与主题入口"
          role: "**国际口径**的劳动/职业安全/培训基线（公约与建议书清单）"
          status: "有效（在线可达）"
          endpoint: "https://www.ilo.org/topics"
          retrieval_patterns:
            - "主题入口：https://www.ilo.org/topics（已核实可达）"
            - "出版物检索：https://www.ilo.org/publications（已核实可达）"
          note: "查什么：国际公认的劳动保护、职业安全与培训基线（哪类培训是国际共识）。何时用：设计**通用内训框架**、或需要跨境可比的基线口径时。⚠ ILO 文本**不自动等于任一法域的强制要求**——中国法域须另查本地法规。"
          license_rule: "ILO 出版物署名引用即可；不整本搬运。"
        - name: "欧盟法官方入口（EUR-Lex）"
          role: "**欧盟法域**的法规原文入口（指令/条例/决定全文）"
          status: "有效（在线可达；⚠ 对脚本客户端返回 202/异常响应，须用浏览器式抓取或人工访问）"
          endpoint: "https://eur-lex.europa.eu/homepage.html"
          retrieval_patterns:
            - "总入口（欧盟法全文检索）：https://eur-lex.europa.eu/homepage.html（已核实可达——curl 返回 202，页面本体正常）"
            - "高级检索表单：https://eur-lex.europa.eu/advanced-search-form.html（已核实可达）"
            - "官方公报直链入口：https://eur-lex.europa.eu/oj/direct-access.html"
          note: "查什么：欧盟法规/指令的**原文与现行版本**（含 CELEX 号、修订关系、生效日期）。何时用：任务适用法域为欧盟成员国时。⚠ **CELEX 号与条款号一律现查**；本包不预置任何 CELEX 号或条款号。"
          license_rule: "欧盟法文本由出版局统一发布，官方文本可引用；须标 CELEX 号与版本日期。"
        - name: "美国职业安全与健康管理局（OSHA）入口"
          role: "**美国法域**的职业安全与健康监管要求入口（法规、标准、指引）"
          status: "有效（在线可达）"
          endpoint: "https://www.osha.gov/"
          retrieval_patterns:
            - "机构入口（法规/标准/指引分区）：https://www.osha.gov/（已核实可达）"
          note: "查什么：美国法域下与工作场所安全/培训/记录保存相关的监管要求。何时用：任务适用法域为美国时。⚠ 具体条款号、标准号（如 XX CFR 第几条）**一律现查**，本包不预置。"
          license_rule: "美国政府作品多数可自由引用，注明出处与检索日期即可。"
        - name: "中国法律法规与政策官方入口"
          role: "**中国法域**的法律/行政法规/部门规章原文入口"
          status: "有效（在线可达）"
          endpoint: "https://flk.npc.gov.cn/"
          retrieval_patterns:
            - "国家法律法规数据库（法律/行政法规/司法解释）：https://flk.npc.gov.cn/（已核实可达）"
            - "中国政府网政策文件库：https://www.gov.cn/zhengce/（已核实可达）"
            - "农业农村部（本行业主管部门）政策与公告：https://www.moa.gov.cn/gk/（已核实可达）"
          note: "查什么：**现行有效**的法律/法规/规章原文与其施行/修订日期。何时用：任务适用法域为中国时；涉合规/用工/财税结论时**必查**。⚠ 须核对**现行版本与生效日期**，并注意地方性规定不可全国互推；**具体条款号一律现查**。"
          license_rule: "政府公开文本可引用，注明出处与检索日期。"
      time_layers:
        - "监管要求 / 制度条款 → 现查现行版本，注明生效年份"
        - "通用方法论 → 相对稳定，但案例与工具版本须现查"
      dual_source_rule: "关键结论至少双源核验（制度原文 + 独立实务来源）；制度版本不一致时以现行版为准并注明"

