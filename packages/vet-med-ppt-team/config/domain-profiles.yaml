# domain-profiles.yaml — 内容域档案（唯一数据源，v3.17.0 新建）
# ══════════════════════════════════════════════════════════════════════
# 为什么要有这个文件（2026-10-24 批次 A 实测问题，非假设）：
#   本专家包的实际能力是「一套可复用于**任意教学/培训主题**的 PPT 诊断与优化工作流」，
#   但**兽医绑定被写死在了角色身份里**：
#     · agents/dvm-content-expert.md 的 profession = 「动物医学内容专家」
#     · 其知识路由表 7 个库全部是《禽病》《猪病》《牛羊病》《伴侣动物疾病》…
#     · 其检索式示例全部是鸡/鸭/IBDV/DHAV
#   换主题（如「Python 入门」）时，该成员的身份声明与知识路由表**整体失效**，
#   而包内无第二个内容角色可接手。
#
# 本文件把「一个域长什么样」变成**声明式数据**，代码只组装不判断：
#   · 域之间**只差档案、不差代码**——新增一个域 = 加一段 yaml，不改任何 .py
#   · 域的**选择**（用户主题 → 哪个域）是**语义判断，由主理人（LLM）做**；
#     本文件里的 `match_hints` 是**给 LLM 看的选域菜单**，
#     ⚠ 脚本**严禁**用 match_hints / 关键词 / 正则去自动选域（分工宪法）。
#
# 消费方：
#   · scripts/harness.py#cmd_domain（domain list / domain show）
#   · scripts/harness.py#cmd_route（route --domain <id>：追加域字段 + 坍缩产物落盘）
#   · scripts/harness.py#cmd_collapse（坍缩产物落盘 / 确认 / 查询）
#   · agents/dvm-content-expert.md（**只引用路径**，不复制内容——防双源漂移）
#   · scripts/ensure_settings.py#check_domain_binding_residue（第 23 项残留巡检）
#
# 与 config/domain_config.yaml 的分工（两者不是一回事，勿混）：
#   domain_config.yaml   = **病例库/学科模块**域（animal-medicine/microbiology/pet/tcm-vet），
#                          服务 case_extract.py 的 DISEASE_MAP 与三源核验源配置
#   本文件                = **内容域档案**（内容专家的人格/证据轴/检索通道/术语/红线）
#   → id 命名有意与前者对齐（animal-medicine 两边同名），便于跨表引用；
#     但**语义不同**：前者是"病例从哪来"，本文件是"这个域的内容专家该怎么干活"。
#
# 诚实声明（v3.17.0 首批；**v3.17.0 批次 B 修订**）：
#   · 示例域（computing / business-training）的机构源只写**确知的机构名**，
#     **不编造具体标准号、URL、阈值、统计数字**——凡未确知的写 null 或"待补"并注明。
#   · **v3.17.0 批次 B 修订**：本文件**现含一批实端点 URL**（动物医学域的机构权威源
#     + 两个示例域的官方入口站），每条均**于 2026-10-24 联网现查核实可达**，
#     并按 `image_channel` 现有结构附 `retrieval_patterns` 与 `note`（查什么 / 何时用）。
#     登记规则（**新增 URL 必守**）：
#       ① **只写实际访问过、确认可达的 URL**——查不到就写 `待补` 并说明查证过程，**严禁编造**；
#       ② **不写未经现查的标准号 / 条款号 / 阈值 / 统计数字**——端点只是"入口"，
#          入口可达**不等于**具体版本或数值已知（版本与数值一律现查）；
#       ③ **深链不稳定时只写入口站**（如 standards 目录页）而非具体条目页；
#       ④ 端点 URL 的**可用性会漂移**（机构改版/迁移），每次使用前仍须现查核对。
#     凡**未**在本文件登记的链接型事实，一律现查。

version: "3.17.0"

# ── 默认域 ────────────────────────────────────────────────────────────
# 默认域 = 保持现状（动物医学）。**不智能猜测**：非兽医主题必须由主理人显式指定 --domain。
# 理由见 references/course-profile-defaults.md#0-ter。
default_domain: "animal-medicine"

# ── 通用兜底（域档案缺失 / 未坍缩时使用）──────────────────────────────
# ⚠ **不得静默回落某个具体域**（尤其不得回落动物医学域）——域档案读不到就显式报错。
fallback:
  # 域档案缺失时的处置：显式报错（由 harness.py 执行），不猜、不回落
  on_profile_missing: "abort_with_error"
  # 未坍缩（无域档案）时内容专家使用的**通用**人设——不含任何域专有信息
  generic_persona:
    title: "内容权威"
    background: "具备该主题一线实践与教学双重经验的领域专家"
    stance: "证据等级不明的内容不上课件"
    duty_boundary: "只做内容核验、证据检索与分级、术语规范；不做教学设计、不做版式设计"
  # 未坍缩时使用的**通用**证据轴（两条轴独立，见下）
  generic_evidence_hierarchy:
    institutional:
      - "该主题的官方机构 / 主管机关 / 平台官方文档（须现查现行版本）"
    literature:
      - "同行评议研究与高质量综述（须给可核验出处）"
  # 未坍缩时使用的**通用**红线（任何域都成立的底线）
  generic_safety_redlines:
    - "任何涉及生物安全、伦理争议、法律合规边界的内容一律上报主理人，不得自行处理"
    - "不确定就是不确定：查不到就说查不到，置信度低就标低，宁可留白不可编造"

# ══════════════════════════════════════════════════════════════════════
# 域档案清单
# ══════════════════════════════════════════════════════════════════════
# 每段一个域，字段语义见下方 domains[].<字段> 的注释（**每个字段都有明确含义**）：
#   id                 域标识（kebab-case）；路由、坍缩落盘、追溯都用它
#   display_name       域中文名；报告与文档里显示用
#   match_hints        **给主理人（LLM）看的选域线索**——⚠ 只给人看，脚本不得据此匹配
#   role_persona       内容角色人格注入（称号/背景/立场/职责边界）
#   content_axes       该域的内容轴（知识覆盖方向）
#   evidence_hierarchy 来源优先级（**两条独立轴**：institutional 机构权威 / literature 文献权威）
#                       + institutional_endpoints 机构源的**实端点登记**（含检索式模板与用途）
#   user_supplied_sources 用户指定资料源（PDF/URL/本地文件）的处置策略（各域一份）
#   image_channel      该域的配图通道与检索式模板
#   knowledge_bases    该域的**文本型**知识库路由（与 image_channel 并列，二者不混）
#   terminology        该域的术语规范要点
#   safety_redlines    该域的拒收 / 高风险红线
#   knowledge_anchor   该域的**包内**知识锚点（可为 null = 无包内锚点，需联网现查）
#   member_bindings    该域对各成员的**人格绑定方式**（谁吃域人格、谁与域无关）
domains:

  # ────────────────────────────────────────────────────────────────────
  # 域 1：动物医学（原包能力完整迁入——含鸡/鸭/IBDV/DHAV 等全部具体例子）
  # ────────────────────────────────────────────────────────────────────
  - id: animal-medicine
    display_name: "动物医学（兽医临床与疫病防控）"

    # 选域线索——**给人（LLM）看的菜单**。脚本禁止据此自动选域。
    match_hints:
      - "主题词：兽医 / 动物医学 / 禽病 / 猪病 / 牛羊病 / 宠物疾病 / 疫病防控 / 诊断技术 / 养殖场管理"
      - "课程名形态：《××病防治技术》《动物医学××》《禽病防治》《××病学》"
      - "内容涉及：物种（禽/猪/牛羊/犬猫等）、致病机制、诊断与鉴别、疫苗与用药、群体疫病防控"
      - "⚠ 本域之外的任何主题（编程、合规、通用管理…）**不得**选本域"

    # 内容角色人格注入（坍缩产物引用此处，**不在 agent MD 里复制**）
    role_persona:
      title: "动物医学内容权威"
      background: "临床与预防兽医双背景的老兽医"
      stance: "证据等级不明的内容不上课件"
      duties:
        - "供给经核验的动物医学知识（疾病机制/诊断/防控），是团队的反幻觉防火墙"
        - "对课件中的科学性错误直接指出并给正确表述"
      duty_boundary: "只做内容核验、证据检索与分级、术语规范；不做教学设计、不做版式设计"

    # 内容轴（知识覆盖方向）——坍缩产物按此组织知识缺口清单
    content_axes:
      - "病原学与致病机制"
      - "流行病学与群体流行特征"
      - "病理变化与临床症状"
      - "实验室诊断与鉴别诊断"
      - "免疫与防控（疫苗、生物安全）"
      - "兽药使用与合规（处方、休药期、食品安全）"
      - "养殖生产链路（育种/饲养/营养/禽舍环境/设施装备）的现场偏差与隐性判断点"
      - "兽医公共卫生（人畜共患、跨界传播）"

    # ── 课程架构实例（v3.17.0 批次 B · 域绑定残留处置）──────────────
    # 为什么在这里：`agents/pedagogy-architect.md` 曾把「疾病课十模块模板」直接写死在
    #   成员 MD 里，而该成员的 `member_bindings` 声明是 `domain_neutral`
    #   ——**声明与事实相反**：内容实为动物医学专属（禽病/病原/剖检/禽舍），
    #   换到 computing 域时整张表不可用（这与本文件存在的理由是同一件事）。
    #   ⇒ 通用的是**模块骨架**（教学法资产），域专属的是**每模块的具体内容轴**。
    #   下表即动物医学域的实例；教学法骨架见
    #   `agents/pedagogy-architect.md#8-课程模块骨架（域中立）`。
    course_module_templates:
      - id: disease_topic_ten_module
        title: "疾病专题课十模块"
        applies_to: "疾病/主题专题课（如禽流感、新城疫一类病种专题）"
        note: "各模块详略得当、按课时裁剪，不得按教科书目录平铺"
        modules:
          - {no: 1, name: "导入与概述", focus: "真实反直觉临床案例/历史事件引入 → 知识地图 → 学习目标"}
          - {no: 2, name: "病原学", focus: "病原分类、形态结构（配高质量图）、理化特性、关键毒力因子、变异与进化趋势"}
          - {no: 3, name: "流行病学", focus: "传染源、传播途径、易感动物、时空分布（配疫情地图）、关键流行病学数据"}
          - {no: 4, name: "临床表现与病理变化", focus: "多维度临床症状（区分病程）；剖检病变强制「健康-病变」左右对照图；组织病理学特征（对照图+病理描述）"}
          - {no: 5, name: "发病机制与免疫学", focus: "病原入侵-复制-扩散动态过程（强制流程图版式）；致病机理、免疫应答与逃逸策略"}
          - {no: 6, name: "综合诊断", focus: "诊断思路（流行病学+临床+病理三位一体）、实验室金标准（病原分离/血清学/分子生物学）、鉴别诊断表（与 2-3 种相似疾病对比）"}
          - {no: 7, name: "预防与综合防控", focus: "生物安全核心地位、监测预警、疫苗类型与免疫程序、应急处置、One Health（人畜共患/食品安全）"}
          - {no: 8, name: "案例分析与临床决策", focus: "完整真实案例：场主主诉→现场调查→临床剖检图→引导式问题→分组讨论→初步诊断到防控方案制定→专家点评与标准答案收尾"}
          - {no: 9, name: "总结与思政融入", focus: "高度浓缩知识提炼图表；科学精神/职业伦理/动物福利/生物安全责任自然融入"}
          - {no: 10, name: "课堂测评与延伸", focus: "3-5 道选择题 + 1 道综合案例分析题（含人机协同）"}
        # 另一条课型架构：诊断技术课以操作技术为主线，用八大模块架构；
        # 混合课型按主线选主架构、从另一架构借模块。
        sibling_architecture: "诊断技术课用八大模块架构（以操作技术为主线）"
        # 课时不足时的裁剪优先级（保关键诊断链 → 压机制 → 并虚章 → 测评独立）
        trim_priority: "保 1/4/6/8 → 压 2/3/5 → 并 7/9 → 测评 10 独立保留"

    # ── 教学标准与受众层实例（v3.17.0 批次 B）────────────────────────
    # 「了解 / 理解 / 掌握」三档动词的**标尺来源**：本域适用的国家教学标准原文用词。
    # 该标准是**域相关**的（各专业有各自的教学标准），故标尺来源下沉到本域档案；
    # 三档动词本身是**跨域通用**的标尺，故 `references/audience-profile-schema.yaml`
    # 保留 depth_scale 定义并指向本字段取具体来源。
    depth_scale_source:
      standard: "教育部《动物医学专业教学标准》（本科版 / 专科版，2025-02）"
      core_course: "禽病防治技术"
      note: "本域标准对核心课程的要求用词即为「了解 / 理解 / 掌握」三档；专科与本科两版对同一课程的三档动词完全一致——层次差别体现在覆盖面更宽（如本科多「禽-人共患」），而非难度递进"
    # 受众四层的**域相关参数**（层名与 id 仍是 schema 的机器契约，见 references/audience-profile-schema.yaml）
    audience_profile:
      layer_notes:
        - "② 基层兽医及一线：病例主线 + 鉴别诊断决策树 + 用药/休药期；术语可用行话（如法氏囊、胸腺出血）但一切术语须落到可操作判据"
        - "③ 职业本科与本科生：规模化养殖场真实场景，讲「为什么这么判」；理论深度到病原分类/致病机制/免疫应答基本过程"
        - "④ 研究生：含分子机制、演化/选择压、文献争议与证据强度"
      data_requirements:
        - "② 现场可测指标（死淘率/料肉比/抗体滴度）+ 判读阈值 + 来源"
        - "③ 结论性数字 + 样本量与来源；关键数据逐条注来源与年份"
      case_forms:
        - "真实养殖场景（讲「怎么做」，不给复杂决策树）"
        - "规模化养殖场真实场景（讲「为什么这么判」）"
        - "病例为主线 + 鉴别诊断决策树 + 用药与休药期"
      job_context: "执业兽医/实验室/主管部门的职责边界；处方合规、耐药风险、休药期、食品安全"
      interaction_forms:
        - "看图识病变（高频短互动）"
        - "病例讨论、现场/视频演示、故障排查模拟、「如果是你怎么办」"

    # 来源优先级——**两条独立轴**，不可合成一张平铺序数表
    evidence_hierarchy:
      institutional:
        - "现行法规与官方指南（须联网核验现行版本，标注国家/地区与生效年份）"
        - "WOAH / FAO / WHO 等国际组织规范"
        - "MSD Veterinary Manual（默克兽医手册）"
      # ── 机构权威源**实端点登记**（v3.17.0 批次 B 新增）───────────────
      # 缘由（实测缺口，非假设）：`institutional` 原先只列**机构名**，
      #   成员检索时只能盲搜网页 → 命中二手转载页 → 违反本包自己的「机构轴优先」纪律。
      #   现把每条机构源登记为**可直达的端点**，并附检索式模板与用途说明。
      # 结构照 `image_channel.channels`（name / role / status / endpoint / license_rule），
      #   另加 `retrieval_patterns`（检索式模板）与 `note`（查什么 / 何时用）。
      # ⚠ **端点 ≠ 内容**：可达只说明"入口在"，**具体版本/条款/数值仍须现查**。
      # ⚠ 每个 URL 均于 **2026-10-24 联网现查核实可达**（查证过程见各条 note）。
      institutional_endpoints:
        - name: "MSD Veterinary Manual（默克兽医手册·在线专业版）"
          role: "疾病条目级权威参考（临床特征/诊断/治疗/病理），机构轴第三顺位"
          status: "有效（在线可达；条目页三段式路径，章节索引另见 retrieval_patterns）"
          endpoint: "https://www.msdvetmanual.com/veterinary-topics"
          retrieval_patterns:
            - "章节入口：先取 https://www.msdvetmanual.com/veterinary-topics（主题总览），再按学科进 https://www.msdvetmanual.com/<section>/（已核实可达的 section：poultry / infectious-diseases / generalized-conditions / digestive-system / respiratory-system / immune-system / toxicology / pharmacology）"
            - "条目页 URL 形态：**三段式** https://www.msdvetmanual.com/<section>/<chapter>/<topic>（例：https://www.msdvetmanual.com/poultry/avian-influenza-in-poultry-and-wild-birds/avian-influenza-in-poultry-and-wild-birds）"
            - "站内检索式：https://www.msdvetmanual.com/searchresults?q=<英文病名或症状词>（已核实带 q 参数可达；直接拼 /search?q= 实测 404，勿用）"
            - "全站条目清单（机器可读、实测 2858 条主题 URL）：https://www.msdvetmanual.com/sitemaps/veterinary-topic.xml.gz（实测下载并解析，条目路径深度恒为 3 段）"
          note: "查什么：单一疾病的临床症状/实验室诊断/治疗方案/预后，以及'这个病在什么条件下发生'。何时用：讲**具体病种**时（教学主体内容）；查法规与国际规范时**不用**它。⚠ 内容为厂商编写，**版本更新节奏不公开**——引用须标访问日期，不得凭记忆写其内容。"
          license_rule: "官方 FAQ 明示：可分享链接与内容引用，但**转载/改编/公开传播原文（含图片）须书面许可**；课件只引用不整段搬运。"
        - name: "WOAH 陆生动物卫生法典（Terrestrial Animal Health Code）"
          role: "国际标准（通报/监测/贸易/无疫区认定/兽药与疫苗），机构轴第二顺位的**规范性**来源"
          status: "有效（在线可达；现行版次随 WOAH 大会逐年更新，须现查）"
          endpoint: "https://www.woah.org/en/what-we-do/standards/codes-and-manuals/terrestrial-code-online-access/"
          retrieval_patterns:
            - "在线版入口（按 Area/Section → Chapter 逐级展开）：https://www.woah.org/en/what-we-do/standards/codes-and-manuals/terrestrial-code-online-access/"
            - "文件库记录（含版次、发布日期、DOI、版权）：https://doc.woah.org/dyn/portal/index.xhtml?aloId=44951&espaceId=100&page=alo（已核实可达；实取为 33rd edition / 2025 / 980 p. / DOI https://doi.org/10.20506/woah.3723 / CC BY-NC-SA —— **版次与 aloId 会随新版变，引用前须现查**）"
            - "单章静态 HTML（法典）：https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/<年份>/en_chapitre_<slug>.htm（已核实可达示例：tahc/2024/en_chapitre_oie_listed_disease.htm = Chapter 1.3 疾病名录）"
            - "历史版本入口：https://www.woah.org/en/what-we-do/standards/codes-and-manuals/previous-editions-of-the-terrestrial-code/"
          note: "查什么：某病的**通报义务、监测与贸易建议、无疫区/无疫区化程序**、国家/地区官方承认制度。何时用：讲'国际规则怎么定的'，以及给法规条款提供上位框架。⚠ 章节号随版次变动——**引用必须带版次与章节号**（如 TAHC 33rd ed. Chapter 8.x），不得只写'WOAH 法典'。"
          license_rule: "文件库记录页标注 © World Organisation for Animal Health, 2025 - CC BY-NC-SA（署名-非商业-相同方式共享）；课件引用须保留出处与版次。"
        - name: "WOAH 陆生动物诊断试验与疫苗手册（Terrestrial Manual）"
          role: "**诊断方法**标准（采样/送检/试验判定/疫苗生产与检验），与法典配套但用途不同"
          status: "有效（在线版 + 章节 PDF 均可达）"
          endpoint: "https://www.woah.org/en/what-we-do/standards/codes-and-manuals/terrestrial-manual-online-access/"
          retrieval_patterns:
            - "在线版入口（按 Part/Section → Chapter 展开）：https://www.woah.org/en/what-we-do/standards/codes-and-manuals/terrestrial-manual-online-access/"
            - "章节索引（列出全部 Part 1-4 与各章 PDF 链接）：https://www.woah.org/fileadmin/Home/eng/Health_standards/tahm/A_summry.htm（已核实可达；实测含 181 条章链接）"
            - "单章 PDF：https://www.woah.org/fileadmin/Home/eng/Health_standards/tahm/<章节文件名>.pdf（已核实可达示例：1.01.06_VALIDATION.pdf = Chapter 1.1.6 诊断试验验证；202405_Chapter_1.1.09_TESTS_FOR_STERILITY.pdf = Chapter 1.1.9）—— ⚠ **文件名含年份前缀且随版次变，须先取索引再拼 URL**"
          note: "查什么：**实验室怎么检**（样本类型、前处理、试验方法与判定）、以及疫苗生产的最低要求。何时用：讲'实验室诊断流程'与'疫苗质量要求'，以及做**病例三源核验的方法学依据**。⚠ 与法典**不是同一本**，讲'通报/贸易'用法典、讲'怎么检'用本手册。"
          license_rule: "同属 WOAH 国际标准系列；单章引用须标章节号与版次，PDF 整本不搬运。"
        - name: "WOAH 技术疾病卡（Technical Disease Cards）+ WAHIS 疫情数据"
          role: "单病速查页（临床/传播/诊断/防控要点 + 直连法典与手册章节）+ 全球动物疫情实况"
          status: "有效（在线可达；疾病卡 URL 形态为 /en/disease/<slug>/）"
          endpoint: "https://www.woah.org/en/disease/"
          retrieval_patterns:
            - "疾病卡 URL 形态：https://www.woah.org/en/disease/<疾病英文 slug>/（已核实可达示例：avian-influenza、foot-and-mouth-disease、newcastle-disease、infectious-bursal-disease-gumboro-disease、duck-virus-hepatitis、avian-infectious-bronchitis、rabies、paratuberculosis）"
            - "疾病卡页内直接给出 'LINKS TO CODE AND MANUAL'（跳法典/手册对应章）——**先读疾病卡定位章号，再去法典/手册取原文**，是本域最省步骤的路径"
            - "全球疫情实况：https://wahis.woah.org/（已核实可达；用于'近期某地是否暴发'类时效问题）"
            - "疾病数据采集说明：https://www.woah.org/en/what-we-do/animal-health-and-welfare/disease-data-collection/"
          note: "查什么：单病的**一页式要点**（临床表现/传播/公共卫生风险/防控）与**当前全球疫情通报**。何时用：写讲义单页速查、做'近期疫情'时效内容；**正式条款仍须回法典/手册取原文**。⚠ 疾病卡是摘要不是规范，不得单独作为条款依据。"
          license_rule: "WOAH 站点内容；引用须标出处与访问日期。"
        - name: "FAO 动物卫生（资料页 + 知识库 OpenKnowledge）"
          role: "现场操作手册/风险评估工具/跨境动物病框架等**实操型**国际机构资料"
          status: "有效（在线可达；资料页 + 出版物库 + DOI 三条通道）"
          endpoint: "https://www.fao.org/animal-health/en/"
          retrieval_patterns:
            - "资料库首页：https://www.fao.org/animal-health/en/（已核实可达；含 areas-of-work 各栏与最新出版物流）"
            - "工作领域入口（按主题）：https://www.fao.org/animal-health/areas-of-work/<slug>/en（已核实可达示例：early-warning-and-disease-intelligence、preparedness-and-response、surveillance-and-risk-assessment、veterinary-public-health）"
            - "出版物列表：https://www.fao.org/animal-health/resources/publications/8/en（已核实可达）"
            - "知识库检索式：https://openknowledge.fao.org/search?query=<关键词>（已核实带 query 参数可达）；条目页形态 https://openknowledge.fao.org/handle/20.500.14283/<code>en"
            - "FAO 出版物 DOI 形态：https://doi.org/10.4060/<code>en（已核实可达示例：10.4060/ce1712en）"
            - "经典《FAO Animal Health Manuals》系列（1-14 号，含现场手册）：https://www.fao.org/4/y4143e/y4143e0e.htm（已核实可达；⚠ 该系列多为 1996-2002 年旧作，引用须标出版年）"
          note: "查什么：**现场怎么做**（采样送检操作、应急准备计划、疾病风险评估、监测评价工具 SET/GLEWS+）。何时用：讲实操流程与应急处置、找可直接改造的表格与手册。⚠ 大量资料为旧版（1990s-2000s），**当作方法参考而非现行标准**。"
          license_rule: "FAO 出版物多为 CC BY-NC-SA 3.0 IGO（**逐件现查版权页**）；本包引用以标出处与出版年为主。"
        - name: "WHO 人畜共患 / One Health 技术资料"
          role: "**公共卫生侧**权威（人畜共患病、One Health 框架、卫生系统能力）——动物诊疗规范不归此源"
          status: "有效（主题页 + IRIS 文献库均可达）"
          endpoint: "https://www.who.int/health-topics/zoonoses"
          retrieval_patterns:
            - "主题入口：https://www.who.int/health-topics/zoonoses（已核实可达）"
            - "文献检索式：https://iris.who.int/simple-search?query=<关键词>（已核实带 query 参数可达）；IRIS 库首页 https://iris.who.int/、馆藏集合 https://iris.who.int/collections"
            - "出版物总入口：https://www.who.int/publications（已核实可达）"
            - "全球健康观测站（数据）：https://www.who.int/data/gho（已核实可达）"
          note: "查什么：**人畜共患病的公共卫生风险与防控框架**、全球疾病负担数据。何时用：讲 zoonosis / One Health / 全球流行态势；**动物诊疗与法规一律不走此源**。⚠ 查证记录：WHO 站点 /teams/global-policy-programmes-surveillance-prevention/one-health 实测返回 404/500（**不可用，未登记**）；/publications/i/item/... 深链实测 404，**故只登记上列入口站**。"
          license_rule: "WHO 出版物多为 CC BY-NC-SA（逐件现查）；数据引用须标出处与年份。"
      literature:
        - "同行评议综述与高质量原始研究"
        - "权威教材"
      axes_note: "institutional = **谁说了算**（机构/法规效力）；literature = **证据强度排序**。两轴独立：机构源给出权威性，文献轴给出时效与强度；两者冲突时按 institutional 优先，并按「证据冲突并列原则」呈现双方，不由成员自行抹平。"
      institutional_endpoints_note: "**机构轴 = 端点直达，不得盲搜网页**：检索机构源时从 `institutional_endpoints` 的 `endpoint` / `retrieval_patterns` 起步；命中二手转载页即视为**未命中机构源**（可作文献轴线索，不得当机构源）。端点可达只证明入口在，**版本与条款仍须现查**。"
      time_layers:
        - "诊疗数据 / 流行病学 / 疫苗毒株 / 禁药信息 → 近 5 年"
        - "机制类 / 基础免疫学 → 近 10 年"
        - "经典教材与官方指南 → 不受年限限制，但须核验现行版本"
      dual_source_rule: "重要结论至少双源核验；**三源核验任务**中「三个来源至少两个能命中」才算核验通过"

    # 配图通道与检索式模板（原来硬编码在 agent MD 第 86 行附近）
    image_channel:
      # 通道优先级（取图通道的稳定度排序）
      channels:
        - name: "Ima 知识库（见 knowledge_bases）"
          role: "文本型知识核验优先"
          status: "常失败；图片类命中率低"
        - name: "Europe PMC 开放获取（OA）"
          role: "图片主力——真实病理/病变/组织学图"
          status: "稳定有效"
          endpoint: "https://www.ebi.ac.uk/europepmc/webservices/rest/{PMCID}/supplementaryFiles"
          license_rule: "仅取 CC-BY / 开放获取论文图片"
        - name: "UpNote"
          role: "仅个人笔记文本"
          status: "无嵌入图片，不可指望取图"
        - name: "联网（官方文件 / 指南）"
          role: "法规、毒株、标准号等时效信息"
          status: "有效"
      # 检索式四要素（布尔检索式语法属 Europe PMC 通道；Ima 是「选库+语义召回」，勿把布尔式原样套进 Ima）
      query_elements:
        - "物种（必填）——漏物种会混进非目标宿主文献"
        - "病原或主题（必填）——英文名全称 + 通用缩写"
        - "部位或病变类型（必填）——器官名或病变词"
        - "限定词（可选）——年份区间 / 地域 / 文献类型"
      query_template: "物种 AND (\"病原英文全称\" OR 缩写) AND (靶器官或病变词) AND (限定词) AND 年份区间"
      # 可照抄实例（**示例只是骨架**，具体病原名/缩写/靶器官以当次检索到的原文为准）
      examples:
        - query: "chicken AND (\"infectious bursal disease virus\" OR IBDV) AND (\"bursa of Fabricius\" OR \"bursal lesion\") AND (histopathology OR immunohistochemistry) AND 2020:2026"
          target: "法氏囊大体/组织学图"
          caption_hint: "实验条件：IBDV 感染病例 · 部位：法氏囊 · 临床意义：滤泡淋巴细胞坏死与萎缩 → 免疫抑制"
        - query: "duck AND (\"duck hepatitis A virus\" OR DHAV) AND (liver OR hepatic) AND (histopathology OR \"gross lesion\") AND 2018:2026"
          target: "雏鸭肝大体与组织学图"
          caption_hint: "实验条件：DHAV 感染雏鸭 · 部位：肝 · 临床意义：肝肿大伴出血斑点，急性死亡"
      caption_elements:
        - "实验条件（如「感染 24h 后」）"
        - "部位（如「A.肺叶」）"
        - "临床意义"
      forbidden_sources:
        - "带水印论坛实拍图"
        - "分辨率不足的放大图"
        - "未标来源图"
      image_science_ownership: "图片承载的科学准确性由内容专家核验；标注位置/字号/版式归视觉设计成员"
      knowledge_channel_ref: "knowledge_bases（本域的**文本型**知识库路由，与本节图片通道并列，不混用）"

    # 文本型知识库路由（**原 agent MD 第 47–53 行七库硬编码表原样迁入**）
    # 库 ID 为既有账号内资源标识，非编造；调用时机为路由说明。
    knowledge_bases:
      - name: "《禽病》Avian Disease（主力库）"
        id: "7372985916737739"
        when: "所有禽类疾病主题"
      - name: "《猪病》"
        id: "7372995890793583"
        when: "猪病主题"
      - name: "《牛羊病》"
        id: "7408748326814899"
        when: "反刍动物疾病主题"
      - name: "《伴侣动物疾病》"
        id: "7408031432200206"
        when: "犬猫等宠物疾病主题"
      - name: "病毒学-免疫学-细胞学"
        id: "7372987669968501"
        when: "机制类、免疫类、疫苗类内容"
      - name: "流感"
        id: "7372987141486120"
        when: "流感病毒深入专题"
      - name: "动物疫病诊断技术（WOAH/FAO/WHO）"
        id: "7408735592931220"
        when: "诊断标准、采样送检、国际规范"
    knowledge_bases_discipline:
      - "每次任务只选 1–3 个最相关库；跨物种主题最多 3 库（**库选错比查询串写得糙影响更大**）"
      - "查询串须能读出「物种 + 病原或主题 + 部位或病变 +（如适用）限定词」四个维度，**不必写成布尔式**"
      - "每次任务开始先做工具探针（ima-mcp / UpNote 可用性），探针结果记入 task_state.json，不得重复探测"

    # 术语规范
    terminology:
      - "关键术语首次出现按「中文（English, Abbreviation）」标注"
      - "同一课件术语前后一致"
      - "缩写（IBV/ND/AI 等）首次出现给中文全称 + 一次解释"
      - "近义概念须区分（如抗原漂移 vs 抗原转变），不得混用"
      - "流行病学数字、疫情分布、诊疗建议必标适用时空范围"

    # 红线（拒收 / 高风险）
    safety_redlines:
      - "高风险病原、病原培养、动物攻毒、样品运输：只提供与教学目标匹配的高层级知识、风险提醒与合规要求，**不提供具体操作参数**"
      - "流感 GOF 类内容：直接拒绝并上报主理人"
      - "药物内容：诊断依据、处方合规、耐药风险、休药期、食品安全、执业兽医责任缺一不可；不输出可直接替代临床处方的表述"
      - "疫苗与防控政策：标注国家/地区与生效年份，不同国家策略差异要说明"

    # 包内知识锚点（本域**有**包内锚点）
    knowledge_anchor:
      path: "references/poultry-disease-index.md"
      note: "家禽疫病教学导航索引 + 实验室诊断方法对照表——先查此文件取物种/病原英文名与靶器官骨架，再进检索通道"

    # 用户指定资料源（PDF / URL / 本地文件）——**本单最高优先级来源**
    # 缘由（v3.17.0 批次 B 实测缺口）：需求原文要求工作流能消费「我指定的 PDF、URL」，
    #   但域档案此前**无此通道**——用户给的资料无处安放，成员无从判断该不该以它为准。
    # 接单侧落盘字段见 references/task-intake-checklist.md#B 类第 10 项（intake.user_sources）。
    user_supplied_sources:
      enabled: true
      intake_field: "intake.user_sources"   # 落盘位置：loopB_state.json#intake.user_sources
      default_strategy: "用户指定源 > 域档案通用检索——用户点名给的就是本单的权威依据，**先消费它**；但**不豁免**机构轴核验与双源/三源核验要求（指定源本身不算独立双源之一，除非它本身是机构权威文件）"
      conflict_rule: "与机构权威源冲突时 → 按 `evidence_hierarchy` 的**机构轴优先**，并**显式提示冲突**、按 references/adjudication-rules.md「证据冲突并列原则」并列呈现双方（各附来源与适用范围），**不得**由成员自行抹平或隐去一方"
      traceability_rule: "每条取自指定源的结论须附**可复查定位**（PDF 页码/章节号、URL + 访问日期），不得只写「据用户提供资料」"
      inaccessible_rule: "取不到（路径不存在/URL 不可达/权限不足/内容为空）⇒ 该源涉及的结论标 `[待核实]`，**不得进入正式内容**，并在 issues 上抛"
      license_rule: "版权按源判定，**不因「是用户给的」而豁免**：公开可读 ≠ 可转载；整页复制/配图再发布须先确认授权，否则只引用不复制"
      note: "本字段是**声明式策略**（脚本不判断）；消费方 = 内容专家（agents/dvm-content-expert.md#外部指定源处理纪律）+ 主理人（接单追问与制作前置门核对）"
    # 域人格绑定到哪些成员（**声明式**；脚本只读取，不判断"该不该绑"）
    member_bindings:
      - member: "dvm-content-expert"
        binding: "persona_subject"      # 吃域人格注入（内容专家）
        note: "内容专家 = 域人格承载者"
      - member: "pedagogy-architect"
        binding: "domain_neutral"       # 教学法与域无关
        note: "教学设计方法论与域无关，域切换不影响其职责"
      - member: "visual-slide-designer"
        binding: "domain_neutral"
        note: "版式与视觉规范与域无关，域切换不影响其职责"
      - member: "ppt-producer"
        binding: "domain_neutral"
        note: "制作与门禁执行与域无关"
      - member: "verifier"
        binding: "domain_neutral"
        note: "独立验证方法论与域无关；核验对象的科学性由内容专家负责"

  # ────────────────────────────────────────────────────────────────────
  # 域 2：computing（示例域——证明「非兽医主题完全可用」）
  # ────────────────────────────────────────────────────────────────────
  - id: computing
    display_name: "计算机与软件工程"

    match_hints:
      - "主题词：编程语言 / 算法与数据结构 / 前端 / 后端 / 数据库 / 系统设计 / DevOps / 测试工程 / 编译原理"
      - "课程名形态：《Python 入门》《数据结构与算法》《Web 开发实践》《软件工程导论》"
      - "内容涉及：语言特性、代码语义、版本差异、工具链、性能与工程实践"
      - "⚠ 面向**教学**的编程主题；纯工程运维/数据分析另议"

    role_persona:
      title: "软件工程内容权威"
      background: "有生产工程实践与一线教学经验的工程师"
      stance: "能复现的才算数——不编造 API 行为、不凭记忆写版本特性"
      duties:
        - "供给经核验的工程知识（语言语义、机制原理、工具链用法），并标注版本适用性"
        - "对课件中的代码错误与过时表述直接指出并给正确写法"
      duty_boundary: "只做内容核验、证据检索与分级、术语规范；不做教学设计、不做版式设计"

    content_axes:
      - "语言语义与类型系统"
      - "算法与复杂度分析"
      - "数据结构选型"
      - "工程实践与工具链（构建、版本管理、依赖）"
      - "版本差异与兼容性"
      - "测试与调试方法"
      - "性能与资源模型"

    evidence_hierarchy:
      institutional:
        - "语言与平台的**官方文档 / 语言规范 / 参考手册**（须现查对应版本）"
        - "标准组织发布的规范（W3C / IEEE / ISO 等——**具体标准号一律现查，不得凭记忆写**）"
        - "框架与库的官方文档、版本发布说明（release notes）"
      literature:
        - "同行评议论文与预印本"
        - "高质量技术书籍（须注明版本与出版年）"
      axes_note: "机构轴给「什么是规范/官方行为」，文献轴给「为什么这样设计、实证如何」。版本敏感内容以机构轴的**具体版本文档**为准。"
      # ── 机构权威源**实端点登记**（v3.17.0 批次 B 新增）───────────────
      # ⚠ **本域的诚实声明**：所有**链接型事实一律现查**——下表只给**官方入口站**，
      #   **不写具体标准号/章节号/版本号**（未核实的一律不写；核实过的深链也不写，
      #   因为标准页 URL 随版本漂移，写死反而误导）。端点只解决"去哪查"，
      #   "查到什么版本/条款"必须现查。
      institutional_endpoints:
        - name: "语言与平台官方文档（Python / Go / Rust / ECMAScript 等）"
          role: "**语义与行为的唯一权威**（本域机构轴第一位）——版本敏感事实一律以它为准"
          status: "有效（在线可达）"
          endpoint: "https://docs.python.org/3/"
          retrieval_patterns:
            - "Python 官方文档总入口：https://docs.python.org/3/（已核实可达）；标准库章节 https://docs.python.org/3/library/<module>.html（已核实可达示例：library/os.html）"
            - "Python 版本变更（**判断'某行为是哪个版本引入/移除'的权威处**）：https://docs.python.org/3/whatsnew/index.html（已核实可达）"
            - "Go 官方文档：https://go.dev/doc/（已核实可达）"
            - "Rust 官方书：https://doc.rust-lang.org/book/（已核实可达）"
            - "ECMAScript 规范（TC39）：https://tc39.es/ecma262/（已核实可达）"
            - "MDN Web 文档（浏览器行为的事实参照）：https://developer.mozilla.org/en-US/docs/Web（已核实可达）"
          note: "查什么：**语言语义、API 行为、默认值、版本差异、弃用项**。何时用：写任何代码/命令/配置片段前；教学课件里凡出现'某版本才有/某版本已废弃'的表述，**必须**先在此现查并标适用版本。⚠ 端点只给入口——**具体 API 签名与版本号一律现查**，不得凭记忆写。"
          license_rule: "各语言文档许可各异（多为允许引用、限制整段搬运）；课件只引用不整段复制 API 文档原文。"
        - name: "标准组织入口（W3C / ISO / IEEE / ECMA）"
          role: "**规范原文**（当'官方行为'需回到规范条文时用）"
          status: "有效（在线可达；⚠ 部分站点对脚本/爬虫返回 403，须用浏览器式抓取或人工访问）"
          endpoint: "https://www.w3.org/standards/"
          retrieval_patterns:
            - "W3C 标准总览：https://www.w3.org/standards/（已核实可达——注意：**对 curl 等脚本客户端返回 403**，须换 UA/用 WebFetch 取）"
            - "W3C 技术报告（TR）列表：https://www.w3.org/TR/（已核实可达，同样对脚本 403）"
            - "ISO 标准目录（**具体标准号必须现查后拼，不得凭记忆写**）：https://www.iso.org/standards.html（已核实可达；对脚本返回 403）"
            - "IEEE SA 标准检索：https://standards.ieee.org/（已核实可达；站内检索入口 https://standards.ieee.org/standard/ —— 对脚本返回 403）"
            - "ECMA 标准目录：https://ecma-international.org/publications-and-standards/standards/（已核实可达）"
          note: "查什么：**规范原文条款**、标准的状态（现行/已废止/被替代）。何时用：官方文档说不清'为什么这样规定'，或需引用规范条款号时。⚠ **本包不预置任何标准号**——ISO/IEC/IEEE 的编号必须现查现引，且须标注标准版本与年份。"
          license_rule: "标准正文多受版权保护（ISO/IEC/IEEE 全文通常需购买或只给摘要）；课件只引用条目与要点，不复制标准全文。"
      time_layers:
        - "版本敏感事实（API、默认值、弃用项）→ 以该版本官方文档为准，现查现引"
        - "算法复杂度等稳定结论 → 不受版本限制，但须给可核验出处"
      dual_source_rule: "关键结论至少双源核验（官方文档 + 独立可核验来源）；两者不一致时并列呈现并标注版本差异"

    image_channel:
      channels:
        - name: "官方文档与官方图示"
          role: "架构图 / 流程图 / 行为示意"
          status: "有效"
        - name: "开源项目官方文档图示"
          role: "工具界面与配置示意"
          status: "有效（须标注版本）"
        - name: "联网检索教材配图"
          role: "补充示意"
          status: "须核验授权与出处"
      query_elements:
        - "技术栈 / 组件名"
        - "版本或标准（越具体越好）"
        - "具体场景 / 概念 / API"
      query_template: "<技术栈/组件> <版本> <场景或概念>"
      examples:
        - query: "asyncio 事件循环 任务调度 原理"
          target: "事件循环调度机制示意图"
          caption_hint: "运行环境：Python 版本 · 核心概念：任务调度 · 教学意义：为什么回调不会阻塞"
        - query: "hash table 冲突解决 链地址 开放寻址 示意图"
          target: "哈希表两种冲突解决方式对照图"
          caption_hint: "运行环境：数据结构通用 · 核心概念：冲突解决 · 教学意义：空间/时间权衡"
      caption_elements:
        - "运行环境与版本"
        - "图示/代码要点"
        - "教学意义"
      forbidden_sources:
        - "无来源截图"
        - "与所述版本不符的界面截图"
        - "AI 生成图冒充真实工具界面或运行结果"
      knowledge_channel_ref: "knowledge_bases（本域无账号内知识库，**不得回落动物医学库**；走本节官方文档通道）"

    knowledge_bases: []
    knowledge_bases_note: "本域**没有**账号内/包内知识库——通用兜底是「现查官方文档」，**严禁**静默回落动物医学知识库"

    terminology:
      - "API / 缩写首次出现给全称"
      - "命令、代码片段、配置项一律**逐字可复制**，不给伪代码冒充实操"
      - "同一课件同一概念用同一名称；近义库名须区分"
      - "版本敏感术语必须标注适用版本"

    safety_redlines:
      - "涉及认证授权、密钥、隐私的内容：只给高层原则与合规要求，**不给**可被直接用于未授权访问的操作步骤"
      - "不给绕过访问控制、破解、攻击第三方系统的步骤"
      - "不给未经官方文档确认的「隐藏后门/私有接口」用法"

    knowledge_anchor:
      path: null
      note: "本域**无包内知识锚点**——需联网现查官方文档；本字段写 null 是如实登记，不是缺漏"

    # 用户指定资料源（PDF / URL / 本地文件）——见 animal-medicine 域同名字段的完整语义
    user_supplied_sources:
      enabled: true
      intake_field: "intake.user_sources"
      default_strategy: "用户指定源 > 域档案通用检索——**先消费**用户点名的资料；但**不豁免**机构轴核验与双源核验要求（指定源本身不算独立双源之一，除非它本身是官方文档/规范）"
      conflict_rule: "与机构权威源冲突时 → 按 `evidence_hierarchy` 的**机构轴优先**，并**显式提示冲突**、按「证据冲突并列原则」并列呈现双方，不得自行抹平"
      traceability_rule: "每条结论须附可复查定位（PDF 页码/章节号、URL + 访问日期）"
      inaccessible_rule: "取不到 ⇒ 标 `[待核实]`，**不得进入正式内容**，并在 issues 上抛"
      license_rule: "版权按源判定，不因「是用户给的」而豁免；只引用不复制，除非确认授权"
      note: "本字段是**声明式策略**（脚本不判断）；消费方 = 内容专家 + 主理人"

    member_bindings:
