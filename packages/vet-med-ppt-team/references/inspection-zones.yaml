# references/inspection-zones.yaml — 免检区（块级消费段）登记表
#
# ═══════════════════════════════════════════════════════════════════════
# ⚠ 本文件是**真源的元登记**，不是真源：真源永远是 `config/*.yaml`。
# ⚠ `key_count` 与 `keys_sha256` **不要手写**——由
#     `python3 scripts/ensure_settings.py --dump-block-segments` 生成。
# ⚠ 段键必须是 `<config 文件名>#<段前缀>`（ADR-6）：同名段跨文件是**不同的段**
#     （`domain-profiles.yaml#domains` ≠ `domain_config.yaml#domains`），
#     合并登记会让「新增键处置规则」无法落地。
#
# ── 这是什么 ────────────────────────────────────────────────────────
# 第 18 项（死配置巡检）的静态判据对「父级被代码整块取走」的键**无法逐键确认**
# ⇒ 这些键落在**免检区**里（v3.25.0 实测：39 段 / 1514 键，其中 211 键的末段键名
# 连同名都没撞上）。免检区的键**不是缺陷**——它们按段被消费，只是静态判据看不到。
# 本登记表把「免检区」从**一个总数**变成**可行动清单**：
#   · `consumer`       —— 这段由谁消费（脚本 / 会话层 / 主理人）
#   · `disposition`    —— 这段里**新增键**该怎么处置
#   · `keys_sha256`    —— 段内叶子路径集合的指纹（**集合相等**语义）
#
# ── 守卫（`scripts/test_dead_config_disposition.py::TestInspectionZoneRegistry`）──
#   R1  文件存在且含全部段（缺即 FAIL——它是必交付物）
#   R2  登记的段在实时 config 中仍存在
#   R3  实时叶子路径集合 digest == 登记 `keys_sha256`（段内增/删/改名任一键 ⇒ 判红）
#   R4  实时 `key_count` == 登记 `key_count`（与 R3 交叉核对）
#   R5  实时段集合 == 登记段集合（双向：新段未登记 / 登记了不存在的段 ⇒ 判红）
#   R6  `consumer` / `disposition` ∈ 枚举
#
# ── 处置规则三选一 ─────────────────────────────────────────────────
#   新增键须登记 —— 该键属声明层，由会话层/主理人消费；新增时须在此登记
#   新增键须接线 —— 该键应有代码读取点；新增时须同步接线（否则第 18 项会判死）
#   禁止新增（冻结）—— 该段是判据表/白名单，结构固定；改动须走专门评审
#
# ── 版本绑定 ───────────────────────────────────────────────────────
# 本表与 `config/*.yaml` 的**当前内容**绑定。包版本升级时必须重新生成
# `keys_sha256`（否则 R3 判红——这是刻意的：升级必须重新审视免检区）。
# ═══════════════════════════════════════════════════════════════════════

