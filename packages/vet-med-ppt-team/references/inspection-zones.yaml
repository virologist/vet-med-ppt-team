# references/inspection-zones.yaml — 免检区（块级消费段）登记表
#
# ═══════════════════════════════════════════════════════════════════════
# ⚠ 本文件是**真源的元登记**，不是真源：真源永远是 `config/*.yaml`。
# ⚠ `key_count` 与 `keys_sha256` **不要手写**——由
#     `python3 scripts/ensure_settings.py --dump-block-segments` 生成。
# ⚠ 段键必须是 `<config 文件名>#<段前缀>`（ADR-6）：同名段跨文件是**不同的段**
#     （`domain-profiles.yaml#domains` ≠ `domain_config.yaml#domains`），
#     合并登记会让「新增键处置规则」无法落地。
#
# ── 这是什么 ────────────────────────────────────────────────────────
# 第 18 项（死配置巡检）的静态判据对「父级被代码整块取走」的键**无法逐键确认**
# ⇒ 这些键落在**免检区**里（当前：39 段 / 1514 键，其中 128 键的末段键名
# 连同名都没撞上 ⇒ 属「待人工定性候选」）。免检区的键**不是缺陷**——
# 它们按段被消费，只是静态判据看不到。
# 本登记表把「免检区」从**一个总数**变成**可行动清单**：
#   · `consumer`       —— 这段由谁消费（脚本 / 会话层 / 主理人）
#   · `disposition`    —— 这段里**新增键**该怎么处置
#   · `keys_sha256`    —— 段内叶子**身份集合**的指纹（**集合相等**语义）
#
# ⚠ **`digest_scheme` 字段（顶层）—— 指纹口径声明**：
#   · `indexed-set-v2` —— **当前口径**：对「**带下标 + 带值**的叶子**身份集合**」
#     求指纹。身份串形态 = `<路径>=<值的 repr>`（如
#     `domains[0].expert_panel[2].id='avian_virologist'`）。
#     ⇒ **带下标**：元素身份可辨（换序 ⇒ 下标变 ⇒ 身份变；
#       新增「内容重复」的元素 ⇒ 下标变 ⇒ 身份变）。
#     ⇒ **带值**：内容变更可辨（改 id 的**值** ⇒ 身份变）。
#     ⚠ 实测证明：**只带路径**的指纹（哪怕带下标）**检测不到值变更**
#       （改值时路径一个字都没变）⇒ 值必须进身份，否则核心判据是假的。
#   · `folded-multiset-v1` —— **旧口径**（缺省）：对「**折叠路径多重集**」求指纹。
#     ⚠ 旧口径**漏检**三类改动（折叠后路径集不变 ⇒ 指纹不变 ⇒ 假阴性）：
#       ① 元素**改内容**（值变）；② 元素**换序**；③ 新增**内容重复**的元素。
#     ⇒ 这正是本次升级要修的缺陷。
#   ⇒ **缺省 = 旧口径** ⇒ 登记表若**未**声明本字段，守卫按旧口径解释
#     ⇒ **旧口径登记表仍能过**（向后兼容，不会被误判成「脱节」）。
#   ⇒ 升级口径后**必须**重新生成 `keys_sha256`（39 段的值全部会变）。
#
# ⚠ **`key_count` 与 `keys_sha256` 必须同口径**：
#   `key_count` = **带下标**叶子身份**去重后**的数量（与 `indexed-set-v2` 一致）
#   ⇒ 否则「只改一个字段就蒙混过关」这条交叉核对会出现口径缺口
#   （R3 与 R4 互相打架 ⇒ 误以为有双保险）。
#   ⚠ 实测：本次升级后 39 段的 `key_count` **全部不变**（路径数没变，
#     只是身份串多了「=值」部分 ⇒ 数量不变）⇒ 旧 `key_count` 值继续有效。
#
# ⚠ **`leaf_unused` 字段的口径**（本次修复后已变，看清楚再读）：
#   `leaf_unused` = 该段里「**末段键名在代码中 0 出现**」的键数
#   ⇒ 即「**待人工定性候选**」的个数（不是段的总键数）。
#   ⚠ **人读型登记优先于块级证据**（判定顺序修复后）：
#     「已登记为人读型」**且**「所在段被整块读取」的键 ⇒ 计 `textual`，
#     **不**计入 `leaf_unused`（人读型 ≠ 待定性候选）⇒ 但**仍保留**在
#     本段的 `keys_sha256` 覆盖范围内（段级增量守卫 R3 不被削弱）。
#   ⇒ 因此本次修复让 `leaf_unused` 合计从 211 降到 145（**66 键**是
#     「早被登记定性、却被判定顺序短路成假候选」的那一批）。
#   ⚠ **AST 读取集补第 ④ 种形态后 `leaf_unused` 合计从 145 降到 128**
#     （**17 个键路径**是「键名藏在**元组/列表/集合字面量**里 ⇒ AST 读取集
#     看不见 ⇒ 被**误列**为待人工定性候选」的**假阳性**；
#     典型：`domain-profiles.yaml#domains[].audience_profile.layer_notes` 等
#     —— 它们**确实**被 `assemble_domain_prompt.py` 真实渲染进提示词）。
#     ⇒ 该次修复**只**动 `leaf_unused`/`leaf_weak` 两个**观测**字段；
#       `key_count` / `keys_sha256` **逐段不变**（段内键集合没变），
#       `dead` 判定口径**未动**（死键数仍为 0）。
#   ⚠ **带下标 + 带值改造后 `leaf_unused` 合计仍是 145**（口径未变：仍按
#     「末段键名在代码中 0 出现」计，与元素下标、与值都无关）。
#
# ⚠ **`leaf_weak` 字段的口径**（与 `leaf_unused` **精确对位**，两者互斥且穷尽）：
#   `leaf_weak` = 该段里「**末段键名有出现（撞名）**，但**没有路径级证据**」
#   的键数 —— 即「**弱证据**」（v3.23.0 F1 明写：弱证据 = 仅末段同名撞车，
#   **不是**路径级证据）。
#   ⚠ **为什么需要这个字段（真实判据洞，已实测复现）**：
#     `weak` 桶因「块级证据」已被前置短路而**永不触发**（真包实测 `weak=0`）
#     ⇒ 这批键被「块级证据」层接管 ⇒ **既不判死、也不进 `leaf_unused`、
#       也不进 `weak` 桶** ⇒ **无任何守卫覆盖**（实测 **1029 键 / 68%**）。
#     ⇒ 一个末段名叫 `note` / `description` / `enabled` 的**新键**，加进
#       已登记的免检区段里，会**静默绿灯**（假绿）。
#   ⇒ 修法：**不判死、不进人工定性范围**（这批键大概率确实有人读，
#     在段内被整块消费）⇒ 只是**登记可见** + 守卫 R8 逐段核对。
#   ⚠ **不得**因此改动 `dead` 判定口径（本字段是**纯观测**）。
#   ⚠ 三个桶的口径互斥且穷尽（免检区 1514 键）：
#     人读型登记 357 · 待人工定性候选 128（`leaf_unused`）· 弱证据 1029（`leaf_weak`）
#     ⇒ 128 + 1029 = 1157 = 1514 − 357（**恒等式**，可当交叉核对用）。
#
# ── 守卫（`scripts/test_dead_config_disposition.py::TestInspectionZoneRegistry`）──
#   R1  文件存在且含全部段（缺即 FAIL——它是必交付物）
#   R2  登记的段在实时 config 中仍存在
#   R3  实时叶子身份集合 digest == 登记 `keys_sha256`（段内增/删/改名任一键 ⇒ 判红）
#       ⚠ 按顶层 `digest_scheme` 声明的口径计算「实时 digest」
#         （缺省 = 旧口径 ⇒ 向后兼容）
#   R4  实时 `key_count` == 登记 `key_count`（与 R3 交叉核对，**同口径**）
#   R5  实时段集合 == 登记段集合（双向：新段未登记 / 登记了不存在的段 ⇒ 判红）
#   R6  `consumer` / `disposition` ∈ 枚举
#   R7  实时 `leaf_unused` == 登记 `leaf_unused`（逐段；「待人工定性候选」桶的大小）
#   R8  实时 `leaf_weak`   == 登记 `leaf_weak`  （逐段；「弱证据洞」的大小）
#   ⚠ R7 / R8 是**新增**判据（R1–R6 的编号与语义**零改动**）
#     ⇒ 登记表**缺** `leaf_weak` 字段 ⇒ R8 必判红 ⇒ **必须**升级本表。
#
# ── 处置规则三选一 ─────────────────────────────────────────────────
#   新增键须登记 —— 该键属声明层，由会话层/主理人消费；新增时须在此登记
#   新增键须接线 —— 该键应有代码读取点；新增时须同步接线（否则第 18 项会判死）
#   禁止新增（冻结）—— 该段是判据表/白名单，结构固定；改动须走专门评审
#
# ── 版本绑定 ───────────────────────────────────────────────────────
# 本表与 `config/*.yaml` 的**当前内容**绑定。包版本升级时必须重新生成
# `keys_sha256`（否则 R3 判红——这是刻意的：升级必须重新审视免检区）。
# ═══════════════════════════════════════════════════════════════════════

