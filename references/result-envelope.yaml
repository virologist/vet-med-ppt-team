# result-envelope.yaml — 成员回传信封单一数据源（v3.12.0 · 治本件）
#
# 定位：回传信封的**唯一定义源**。harness.py 的校验器与所有 agent MD 的回传规范
#       必须引用本文件，任何一方不得自行定义字段（v3.11.0 起沿用同一治本思路）。
#
# 背景（真实缺陷，非假设）：v3.11.0 及之前，包内存在**三套互斥的 schema 定义**：
#   ① references/spawn-protocol.md:19 自称「唯一权威源、执行以本文件为准」，
#      要求 {from, stage, artifact, warnings, evidence_used, next_recommendation}
#   ② scripts/harness.py:771 ENVELOPE_REQUIRED 校验
#      {agent_id, task_id, phase, status, confidence, deliverable_summary}
#   ③ 5 个 agent MD 各自的 10 字段版本（含 evidence/issues/next_agent_hint/metrics）
#   ④ agents/ppt-producer.md §75 与 §117 自相矛盾（同一文件两套）
# 后果：按 ① 产出的**合规**信封会被 ② 判「缺字段 → 退回补充」；按 ②③ 产出则被 ① 判「回传失败」。
#
# 消费方：scripts/harness.py（校验 + schema 自检）、references/spawn-protocol.md、
#         agents/*.md 的回传格式章节

schema_version: 1
version: "3.27.0"
# ── 必填字段（harness.py 的 verify-envelope 按此校验；改这里即改校验器）────
required:
  - agent_id
  - task_id
  - phase
  - status
  - confidence
  - deliverable_summary

# ── 选填但强烈建议（缺失不判失败，但 V 层审阅时会扣"可追溯性"分）────────
optional:
  - evidence
  - issues
  - next_agent_hint
  - metrics
  # v3.17.0 新增（通用化追溯所需；缺省不判失败）
  - domain
  - routing

status_enum: [success, partial, failed, blocked]

# ── 字段语义与判据（消除各 MD 自行解释的空间）────────────────────────
fields:
  agent_id:
    type: string
    required: true
    rule: "成员 Agent ID（agents/<id>.md 的文件名，不含 .md）"
  task_id:
    type: string
    required: true
    rule: "与任务包 task_id 逐字符一致；不一致判回传失败"
  phase:
    type: string
    required: true
    rule: "阶段标识（沿用 sop-stages.md 的阶段编号/名称）"
  status:
    type: enum
    required: true
    rule: "只能用 status_enum 四值之一"
    criteria:
      success: "完整满足任务包 objective，且 issues 为空"
      partial: "部分满足，或存在 issues（非空）"
      failed: "无法满足且可重试"
      blocked: "前置条件不足或能力不可用，不得靠重试解决"
  confidence:
    type: string
    required: true
    rule: "自评置信度，须带依据（计数/文件路径/命令输出），禁「高/中/低」裸标签"
  deliverable_summary:
    type: string
    required: true
    rule: "产出摘要，须含可验证计数（落盘路径 + 原始 P0/P1/P2 计数），禁「已优化/归零/100%」表述"
  evidence:
    type: array
    required: false
    rule: "支撑结论的证据条目：来源（DOI/PMID/URL/文件路径）+ 核验方式"
  issues:
    type: array
    required: false
    rule: "阻塞或缺口。Loop B 下成员上抛缺失信息的**唯一通道**，不得直接联系用户"
  next_agent_hint:
    type: string
    required: false
    rule: "给下游成员或主理人的建议，交接内容一律经主理人中转"
  metrics:
    type: object
    required: false
    # v3.17.0 放宽：原为硬限 2 键 [duration_ms, retry_count]，属**过度收紧**——
    #   metrics 是选填的自增字段，硬限会把成员逼到「删指标」或「谎报键名」，
    #   比不登记更糟。改为「已知键白名单 + 未知键只告警不失败」，
    #   与 content_rules.metrics_keys_subset 的既有行为一致（severity=warn）。
    known_keys: [duration_ms, retry_count]
    rule: "耗时与重试次数等度量，供预算判定；未知键只告警不失败（见 content_rules.metrics_keys_subset）"
  # ── v3.17.0 新增：通用化后信封必须承载的域与坍缩信息 ──────────────
  # 缘由：坍缩机制落地后，一次产出必须能回答「这批是哪个域、选了哪些角色、
  #   依据哪份坍缩产物」。此前信封无此三项，只能塞进 issues（语义超载）
  #   或 next_agent_hint（选填 string，装不下结构化信息）。
  domain:
    type: string
    required: false
    rule: "本次产出所属的领域 id，枚举值取自 config/domain-profiles.yaml#domains[].id；未坍缩时留空"
  routing:
    type: object
    required: false
    keys: [level, members, collapse_artifact]
    rule: "本次任务的路由与坍缩上下文：level=复杂度档(L0-L3)；members=本次实际参与的成员 id 列表；collapse_artifact=坍缩产物落盘路径（由 harness.py route --domain 产出，用于把产出与坍缩决策串起来）"

# ── 历史字段别名（v3.11.0 前的旧 schema，保留映射以便回溯既有 trace）────
# 旧 → 新。**不得**在新产出中使用旧名；读到旧名时 harness 自动归一。
legacy_aliases:
  from: agent_id
  stage: phase
  artifact: deliverable_summary
  warnings: issues
  evidence_used: evidence
  next_recommendation: next_agent_hint

# ── 校验器行为（harness.py 实现须与此一致）─────────────────────────────
validation:
  # 旧字段名出现即判失败（防止 spawn-protocol.md 那套复活）
  reject_legacy_keys: true
  # status 不在枚举内 → 判 partial 退回
  strict_status_enum: true
  # 归一化后仍缺 required 字段 → 判 partial 退回
  normalize_before_check: true

  # ── 内容判据（v3.16.0 新增：**改这里即改校验器**）─────────────────────
  # 背景（真实缺陷）：fields.*.rule 写了语义（confidence 禁裸标签、deliverable_summary
  #   禁裸表述），但 harness.py#cmd_verify_envelope 只判"字段存在且非空"——
  #   `confidence:"高"` 能过校验，规则与校验器是两套，"改这里即改校验器"不成立。
  #
  # 原则：词表、正则、阈值、严重度**全在本段**，harness.py 只做执行
  #   （读取 → 按 id 找执行器 → 判定）。新增规则只改本文件 + 在 harness.py 注册执行器；
  #   规则已声明但 harness.py 无对应执行器时，校验器会**显式告警**（不许静默跳过）。
  #
  # 字段含义：
  #   id        —— 规则标识（harness.py 的执行器按此名注册）
  #   field     —— 作用于哪个信封字段
  #   enabled   —— false 时**显式跳过**并在校验输出里列出（不许偷偷不判）
  #   severity  —— fail=判失败（exit 1）/ warn=只告警（exit 0，但输出 warnings）
  #   rule_ref  —— 报错时引用的人读原文路径（定位到本文件的哪一条语义）
  content_rules:
    - id: confidence_not_bare
      field: confidence
      enabled: true
      severity: fail
      rule_ref: "fields.confidence.rule"
      reason: "自评置信度必须带依据；裸标签（高/中/low…）无法复核，等同自评失真"
      message: "confidence 不得是裸标签——须带可复核依据（数字计数 / 文件路径 / 命令或工具名）"
      # ① 命中裸值集合即判失败（整值比对，去空白、忽略大小写）
      bare_values: ["高", "中", "低", "较高", "较低", "很高", "一般",
                    "high", "medium", "low", "very high", "ok", "good", "n/a"]
      # ② 未命中裸值集合、但长度过短且不含任何证据 → 同样判失败
      #    （长度阈值取 20：实测合规写法"依据 scripts/verify_deck.py 复算 P0=0/P1=2"远长于此；
          #    取过大则漏判、过小则误伤长而无据的套话，此值是可调参数不是铁律）
      max_bare_length: 20
      # 证据三类，任一命中即算"带依据"
      evidence_patterns:
        - id: numeric_count
          pattern: '[0-9零一二三四五六七八九十百千万两]'
          desc: "数字计数（P0=0 / 6 页 / 0.85 / 三处）"
        - id: file_path
          pattern: '[\w.\-~]+(?:[\\/][\w.\-]+)+'
          desc: "文件路径（scripts/verify_deck.py、/tmp/x.md 等含分隔符的路径）"
        - id: tool_or_command
          pattern: '`[^`]{2,}`|\b(?:python3|pytest|git|grep|lint|harness\.py|verify_deck\.py|ooxml_lint\.py|case_extract\.py|snapshot\.py|surgery_deck\.py)\b'
          desc: "反引号包裹的命令，或已登记的工具/脚本名"

    - id: deliverable_summary_verifiable
      field: deliverable_summary
      enabled: true
      severity: fail
      rule_ref: "fields.deliverable_summary.rule"
      reason: "产出摘要须含可验证计数（落盘路径 + 原始 P0/P1/P2 计数）；裸表述无法复核"
      message: "deliverable_summary 不得是裸表述——须含可验证计数（数字计数或落盘路径），并避免『已优化/归零/100%』类无据措辞"
      # ① 命中裸词集 且 不含任何可验证计数 → 判失败
      bare_terms: ["已优化", "已修复", "已完善", "已解决", "已完成", "归零", "清零",
                   "100%", "全部完成", "全部通过", "全部达标", "无问题", "已达标"]
      # 命中裸词后，**先把命中的裸词从文本里剔除**再判"有没有可验证计数"（v3.16.0 实测修正）：
      #   漏网反例："问题已修复归零" 里的"归零"含汉字数字"零"，被证据正则当成"有计数"
      #     → 判据失灵（裸表述自己给自己提供了"计数"）。剔除裸词后剩余"问题"→ 无计数 → 判失败。
      #   同时保住不误伤：'已优化 6 页正文，落盘 demo_wip/v3.pptx；P0=0' 剔除"已优化"后
      #     仍有落盘路径 + 原始计数 → 不判失败（裸词此时只是措辞瑕疵，不是自评失真）。
      evidence_check_excludes_bare_terms: true
      # ② 长度过短 且 不含任何可验证计数 → 判失败（如 "ok" / "完成"）
      min_verifiable_length: 24
      evidence_patterns:
        - id: numeric_count
          pattern: '[0-9零一二三四五六七八九十百千万两]'
          desc: "数字计数（6 页 / P0=0 / 3 条）"
        - id: file_path
          pattern: '[\w.\-~]+(?:[\\/][\w.\-]+)+'
          desc: "落盘路径"

    - id: status_issues_consistency
      field: status
      enabled: true
      severity: fail
      rule_ref: "fields.status.criteria"
      reason: "success 的判据是『完整满足任务包 objective，且 issues 为空』；issues 非空还自评 success 即自评失真"
      message: "status 与 issues 不一致：issues 非空时 status 应为 partial（或 failed/blocked），不得自评 success"
      # 取舍（如实写明为什么不选告警）：告警会被下游当成"可放行"，而自评失真正是要杜绝的行为；
      #   且本条判据完全确定（issues 非空是布尔事实），不存在误判空间，故取 fail。
      inconsistent_pairs:
        success: "issues 非空"

    - id: metrics_keys_subset
      field: metrics
      enabled: true
      severity: warn
      rule_ref: "fields.metrics.known_keys"
      reason: "metrics 是选填自增字段；未知键说明新增了未登记的指标，应留痕供主理人决定是否补进 known_keys"
      message: "metrics 出现 fields.metrics.known_keys 之外的键——请补登记或改用已登记键名"
      # 取舍：只告警不失败——判失败会逼成员删指标或谎报键名（比不登记更糟），
      #   而"未登记指标"本身不造成自评失真，属可追溯性瑕疵。
      allowed_keys_from: "fields.metrics.known_keys"

    # ── v3.17.0 新增：通用化追溯所需的两条域相关判据 ────────────────
    - id: domain_in_profile
      field: domain
      enabled: true
      severity: fail
      rule_ref: "fields.domain.rule"
      reason: "通用化后信封必须自证『这批产出属于哪个域』；域 id 写错会让 trace 与台账按域聚合时归错桶，且域 id 是坍缩决策的锚"
      message: "domain 不在 config/domain-profiles.yaml 的域 id 集合内——请用 `harness.py domain list` 查合法域 id"
      # 取舍：判失败而非告警——域 id 写错是**事实性错误**（枚举成员资格），
      #   不存在"合理解释但域不对"的空间，判据完全确定，无假阳性空间。
      #   另：域枚举源读不到时同样判失败（不得静默放行，否则 domain 字段形同装饰品）。
      enum_source: "config/domain-profiles.yaml#domains[].id"

    - id: routing_structure
      field: routing
      enabled: true
      severity: fail
      rule_ref: "fields.routing.rule"
      reason: "routing 把『本次产出属于哪次路由与哪次坍缩』钉在信封里；缺子键则产出与坍缩决策断链，通用化后无法追溯"
      message: "routing 结构不合规——须含 level / members / collapse_artifact 三键（见 references/result-envelope.yaml#fields.routing）"
      # 取舍：判失败——子键有无是布尔事实，无歧义；且坍缩链路刚落地，
      #   此处不拦住就等于让『坍缩了但产出没带路由信息』畅通无阻。
      required_keys: [level, members, collapse_artifact]

    # ── 显式禁用（不是偷偷跳过）───────────────────────────────────────
    - id: confidence_requires_evidence_array
      field: confidence
      enabled: false
      severity: fail
      rule_ref: "fields.confidence.rule"
      reason: "（候选规则）带依据的 confidence 必须另附非空 evidence 数组"
      disabled_reason: >-
        判据天然模糊、无法校准：「依据充分到什么程度必须另给 evidence 数组」没有可判定的界，
        且纯计算/纯格式类任务确实没有外部证据条目，启用会稳定产生假阳性（合格回传被判失败），
        而假阳性会逼成员注水凑 evidence，比原缺陷更糟。
        故显式置 enabled=false，由 harness.py 在校验输出里列出"已禁用规则"，不做静默跳过。
        启用前置条件：先跑 ≥20 例真实成员回传做假阳性率校准，把实测数字回填到本注释再改 true。

# ── 反向漂移守卫（供 ensure_settings 第 17 项扫描）─────────────────────
drift_guard:
  forbidden_in_references_and_agents:
    # spawn-protocol.md:19 的旧 schema 字面量——已被本文件取代
    - '"from", "stage", "artifact", "warnings", "evidence_used", "next_recommendation"'
  required_files_referencing_schema:
    - "references/spawn-protocol.md"
    - "scripts/harness.py"